      function getAllowedMenuTree() {
        const tree = [];
        const curRole = ONSStore.getRole();
        MENU_TREE.forEach((sect) => {
          const allowedItems = [];
          (sect.items || []).forEach((item) => {
            if (!ONSStore.canAccessView(item.viewId)) return;
            if (item.roles && !item.roles.includes(curRole)) return;
            const multiOn = ONSStore.isMultiBranchEnabled ? ONSStore.isMultiBranchEnabled() : false;
            const filteredTabs = (item.tabs || []).filter((t) => {
              if (t.roles && !t.roles.includes(curRole) && !(ONSStore.canAccessSubTab && ONSStore.canAccessSubTab(item.viewId, t.subTab))) return false;
              if (item.viewId === 'settings' && ONSStore.canAccessSubTab && !ONSStore.canAccessSubTab('settings', t.subTab)) return false;
              return true;
            });
            allowedItems.push(Object.assign({}, item, { tabs: filteredTabs }));
          });
          if (allowedItems.length) tree.push(Object.assign({}, sect, { items: allowedItems }));
        });
        return tree;
      }

      let sidebarCollapsed = localStorage.getItem(SIDEBAR_MINI_KEY) === '1';
      let openSubmenus = new Set([ONSStore.AppState.activeView || 'dashboard']);
      try {
        const savedSubs = JSON.parse(localStorage.getItem(OPEN_GROUPS_KEY) || 'null');
        if (Array.isArray(savedSubs)) openSubmenus = new Set(savedSubs);
      } catch (e) {}

      function persistOpenSubmenus() {
        try { localStorage.setItem(OPEN_GROUPS_KEY, JSON.stringify(Array.from(openSubmenus))); } catch (e) {}
      }

      window.toggleMenuSub = function (viewId) {
        if (!viewId) return;
        const willOpen = !openSubmenus.has(viewId);
        if (willOpen) openSubmenus.add(viewId);
        else openSubmenus.delete(viewId);
        persistOpenSubmenus();

        const wraps = document.querySelectorAll('[data-subwrap-id="' + viewId + '"]');
        const carets = document.querySelectorAll('[data-subcaret-id="' + viewId + '"]');
        if (wraps && wraps.length) {
          wraps.forEach((w) => w.classList.toggle('is-open', willOpen));
          carets.forEach((c) => c.setAttribute('aria-expanded', willOpen ? 'true' : 'false'));
        } else {
          window.syncNavHighlight();
        }
      };

      window.toggleAllSubmenus = function (expandAll) {
        const tree = getAllowedMenuTree();
        const tabViews = [];
        tree.forEach((s) => s.items.forEach((it) => { if ((it.tabs || []).length > 1) tabViews.push(it.viewId); }));
        const hasOpen = openSubmenus.size > 0;
        const nextExpand = typeof expandAll === 'boolean' ? expandAll : !hasOpen;
        openSubmenus = new Set(nextExpand ? tabViews : []);
        persistOpenSubmenus();
        window.syncNavHighlight(true);
      };

      window.onSelectMenuItem = function (viewId, defSub, hasTabs) {
        if (hasTabs) {
          openSubmenus.add(viewId);
          persistOpenSubmenus();
        }
        window.navigateView(viewId, defSub || '');
      };

      function findActiveSectionAndItem() {
        const st = ONSStore.AppState;
        const tree = getAllowedMenuTree();
        for (const sect of tree) {
          for (const item of sect.items) {
            if (item.viewId === st.activeView) return { sect, item };
          }
        }
        const firstSect = tree[0] || { id: 'sect-main', label: 'Utama', items: [] };
        return { sect: firstSect, item: firstSect.items[0] || null };
      }

      window.syncNavHighlight = function (forceRebuild) {
        const st = ONSStore.AppState;
        const curView = st.activeView;
        const sideMount = document.getElementById('sidebarMenuMount');
        const subBar = document.getElementById('workspaceSubnavBar');
        const canFastPatch = !forceRebuild && sideMount && typeof sideMount.querySelectorAll === 'function' && sideMount.querySelectorAll('[data-nav-row-id]').length > 0;

        if (canFastPatch) {
          const { item } = findActiveSectionAndItem();
          const tabs = (item && item.tabs) || [];
          const curSub = (st.subTabs && st.subTabs[curView]) || (tabs[0] && tabs[0].subTab) || '';
          const subKey = curSub ? (curView + ':' + curSub) : '';
          document.querySelectorAll('[data-nav-row-id]').forEach((el) => {
            el.classList.toggle('active', el.getAttribute('data-nav-row-id') === curView);
          });
          document.querySelectorAll('[data-subnav-id]').forEach((el) => {
            el.classList.toggle('active', subKey !== '' && el.getAttribute('data-subnav-id') === subKey);
          });
          document.querySelectorAll('[data-subwrap-id]').forEach((el) => {
            const vid = el.getAttribute('data-subwrap-id');
            el.classList.toggle('is-open', openSubmenus.has(vid));
          });
          document.querySelectorAll('.ons-nav-group').forEach((grp) => {
            const vid = grp.getAttribute('data-nav-group-id');
            grp.classList.toggle('is-open', openSubmenus.has(vid));
            grp.classList.toggle('has-active', vid === curView);
          });
          document.querySelectorAll('[data-subcaret-id]').forEach((el) => {
            const vid = el.getAttribute('data-subcaret-id');
            el.setAttribute('aria-expanded', openSubmenus.has(vid) ? 'true' : 'false');
          });
          if (subBar) subBar.innerHTML = renderSubnavBarHtml();
        } else {
          const menuHtml = renderMenuTreeHtml();
          if (sideMount) sideMount.innerHTML = menuHtml;
          const drawerMount = document.getElementById('drawerMenuMount');
          if (drawerMount) drawerMount.innerHTML = menuHtml;
          if (subBar) subBar.innerHTML = renderSubnavBarHtml();
        }
        document.querySelectorAll('[data-mobile-nav]').forEach((el) => {
          const isMatch = el.getAttribute('data-mobile-nav') === curView;
          el.classList.toggle('is-active', isMatch);
        });

      function getSearchableFeatures() {
        const tree = getAllowedMenuTree();
        const list = [];
        tree.forEach((sect) => {
          (sect.items || []).forEach((item) => {
            const tabs = item.tabs || [];
            if (tabs.length > 0) {
              tabs.forEach((t) => {
                const isKasirPos = item.viewId === 'pos' && t.subTab === 'kasir';
                list.push({
                  viewId: item.viewId,
                  subTab: t.subTab,
                  title: isKasirPos ? 'Kasir POS' : t.label,
                  parentLabel: item.label,
                  sectLabel: sect.label,
                  icon: item.icon,
                  kw: `${item.label} ${item.kw || ''} ${t.label} ${t.kw || ''} ${item.desc || ''}`.toLowerCase(),
                  shortcut: isKasirPos ? 'F2' : (t.badge || '')
                });
              });
            } else {
              list.push({
                viewId: item.viewId,
                subTab: '',
                title: item.label,
                parentLabel: sect.label,
                sectLabel: sect.label,
                icon: item.icon,
                kw: `${item.label} ${item.kw || ''} ${item.desc || ''}`.toLowerCase(),
                shortcut: ''
              });
            }
          });
        });
        return list;
      }

      function scoreFeatureMatch(f, q) {
        let score = 0;
        const t = (f.title || '').toLowerCase();
        const p = (f.parentLabel || '').toLowerCase();
        const vid = (f.viewId || '').toLowerCase();
        const sub = (f.subTab || '').toLowerCase();

        // High priority intent keywords
        if (q.includes('kasir')) {
          if (vid === 'pos' && sub === 'kasir') return 10000;
          if (vid === 'pos') return 5000;
        }
        if (q === 'pos') {
          if (vid === 'pos' && sub === 'kasir') return 10000;
          if (vid === 'pos') return 5000;
        }
        if (q.includes('obat')) {
          if (vid === 'obat' && (sub === 'obat' || !sub)) return 10000;
          if (vid === 'obat') return 5000;
        }
        if (q.includes('laporan')) {
          if (vid === 'sipnap') return 10000;
          if (vid === 'finance') return 6000;
        }
        if (q.includes('profil')) {
          if (vid === 'settings' && sub === 'profil') return 10000;
        }
        if (q === 'stok' || q === 'gudang') {
          if (vid === 'gudang') return 10000;
        }
        if (q.includes('penjualan') || q === 'jual') {
          if (vid === 'pos' && sub === 'kasir') return 10000;
          if (vid === 'pos') return 8000;
        }

        // Exact matches
        if (t === q) score += 500;
        if (p === q) score += 300;
        if (sub === q) score += 400;
        if (vid === q) score += 300;

        // Starts with
        if (t.startsWith(q)) score += 200;
        if (p.startsWith(q)) score += 150;

        // Includes
        if (t.includes(q)) score += 80;
        if (p.includes(q)) score += 60;
        if (f.kw.includes(q)) score += 10;

        return score;
      }

      window.filterSidebarMenu = function (rawQ, mountId) {
        const q = String(rawQ || '').toLowerCase().trim();
        const targetMount = mountId ? document.getElementById(mountId) : null;
        const mounts = targetMount ? [targetMount] : [
          document.getElementById('sidebarMenuMount'),
          document.getElementById('drawerMenuMount')
        ].filter(Boolean);

        const clearBtn = document.getElementById('sidebarSearchClearBtn');
        const resBox = document.getElementById('sidebarSearchResults');

        if (!q) {
          if (clearBtn) clearBtn.classList.add('hidden');
          if (resBox) { resBox.classList.add('hidden'); resBox.innerHTML = ''; }
          mounts.forEach((m) => {
            m.querySelectorAll('.ons-menu-section').forEach((s) => { s.style.display = ''; });
            m.querySelectorAll('.ons-nav-group').forEach((g) => { g.style.display = ''; });
            m.querySelectorAll('.ons-submenu-btn').forEach((b) => { b.style.display = ''; });
            m.querySelectorAll('[data-subwrap-id]').forEach((w) => {
              const vid = w.getAttribute('data-subwrap-id');
              w.classList.toggle('is-open', openSubmenus.has(vid));
            });
            m.querySelectorAll('[data-subcaret-id]').forEach((c) => {
              const vid = c.getAttribute('data-subcaret-id');
              c.setAttribute('aria-expanded', openSubmenus.has(vid) ? 'true' : 'false');
            });
          });
          return;
        }

        if (clearBtn) clearBtn.classList.remove('hidden');

        const allFeatures = getSearchableFeatures();
        const matches = allFeatures.filter((f) => {
          return f.title.toLowerCase().includes(q) ||
                 f.parentLabel.toLowerCase().includes(q) ||
                 f.kw.includes(q);
        }).sort((a, b) => scoreFeatureMatch(b, q) - scoreFeatureMatch(a, q));

        // Floating quick results popover (desktop sidebar)
        if (resBox && !mountId) {
          if (matches.length === 0) {
            resBox.innerHTML = `<div class="p-3 text-center text-xs text-slate-500 dark:text-slate-400">Tidak ada fitur yang cocok dengan "<b>${ONSStore.esc(q)}</b>"</div>`;
            resBox.classList.remove('hidden');
          } else {
            resBox.innerHTML = `
              <div class="p-1.5 space-y-0.5">
                <div class="flex items-center justify-between px-2 py-1 text-[10px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">
                  <span>Hasil (${matches.length})</span>
                  <span class="text-blue-600 dark:text-blue-400 font-semibold lowercase">tekan Enter untuk buka</span>
                </div>
                ${matches.slice(0, 6).map((m, idx) => `
                  <button type="button"
                    onclick="window.selectSidebarSearchResult('${m.viewId}','${m.subTab}','${ONSStore.esc(m.title)}')"
                    class="w-full text-left px-2.5 py-1.5 rounded-lg flex items-center gap-2 hover:bg-blue-50 dark:hover:bg-slate-800 transition-colors ${idx === 0 ? 'bg-blue-50/80 dark:bg-slate-800/80 font-semibold text-blue-600 dark:text-blue-400 ring-1 ring-blue-500/30' : 'text-slate-700 dark:text-slate-200'}">
                    <span class="p-1 rounded-md bg-blue-100 dark:bg-blue-900/40 text-blue-600 dark:text-blue-300 shrink-0">${svgIcon(m.icon, 'w-3.5 h-3.5')}</span>
                    <div class="min-w-0 flex-1">
                      <div class="text-xs font-semibold truncate">${ONSStore.esc(m.title)}</div>
                      <div class="text-[10px] text-slate-400 dark:text-slate-400 truncate">${ONSStore.esc(m.parentLabel)}</div>
                    </div>
                    ${m.shortcut ? `<span class="text-[9px] px-1 py-0.5 rounded border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 font-mono font-bold shrink-0">${ONSStore.esc(m.shortcut)}</span>` : ''}
                  </button>
                `).join('')}
              </div>`;
            resBox.classList.remove('hidden');
          }
        }

        // Live DOM filtering & auto-expanding matching submenus
        mounts.forEach((mount) => {
          mount.querySelectorAll('.ons-menu-section').forEach((sectEl) => {
            let sectHasVisible = false;
            sectEl.querySelectorAll('.ons-nav-group').forEach((grpEl) => {
              const vid = grpEl.getAttribute('data-nav-group-id') || grpEl.querySelector('[data-nav-id]')?.getAttribute('data-nav-id');
              const parentBtn = grpEl.querySelector('.ons-nav-row-btn');
              const parentTxt = (parentBtn?.textContent || '').toLowerCase();
              const treeMatch = allFeatures.filter((f) => f.viewId === vid);
              const parentKwMatch = treeMatch.some((f) => f.kw.includes(q) || f.parentLabel.toLowerCase().includes(q));
              const isParentDirectMatch = parentTxt.includes(q) || parentKwMatch;

              const subBtns = Array.from(grpEl.querySelectorAll('.ons-submenu-btn'));
              let anySubMatch = false;

              subBtns.forEach((sb) => {
                const subTxt = (sb.textContent || '').toLowerCase();
                const subNavId = sb.getAttribute('data-subnav-id') || '';
                const subTab = subNavId.split(':')[1] || '';
                const feat = treeMatch.find((f) => f.subTab === subTab);
                const isSubMatch = subTxt.includes(q) || (feat && feat.kw.includes(q));
                if (isSubMatch) anySubMatch = true;
                sb.style.display = (isSubMatch || isParentDirectMatch) ? '' : 'none';
              });

              if (isParentDirectMatch || anySubMatch) {
                grpEl.style.display = '';
                sectHasVisible = true;
                const subwrap = grpEl.querySelector('.ons-nav-subwrap');
                if (subwrap) subwrap.classList.add('is-open');
                const caret = grpEl.querySelector('.ons-nav-caret');
                if (caret) caret.setAttribute('aria-expanded', 'true');
              } else {
                grpEl.style.display = 'none';
              }
            });
            sectEl.style.display = sectHasVisible ? '' : 'none';
          });
        });
      };

      window.handleSidebarSearchKey = function (e, rawQ, mountId) {
        if (!e) return;
        if (e.key === 'Escape') {
          window.clearSidebarSearch();
          return;
        }
        if (e.key === 'Enter') {
          e.preventDefault();
          const q = String(rawQ || '').toLowerCase().trim();
          if (!q) return;
          const allFeatures = getSearchableFeatures();
          const matches = allFeatures.filter((f) => {
            return f.title.toLowerCase().includes(q) ||
                   f.parentLabel.toLowerCase().includes(q) ||
                   f.kw.includes(q);
          }).sort((a, b) => scoreFeatureMatch(b, q) - scoreFeatureMatch(a, q));

          const target = matches[0];
          if (target) {
            window.selectSidebarSearchResult(target.viewId, target.subTab, target.title);
          } else {
            toast('Fitur tidak ditemukan: ' + q, 'warn');
          }
        }
      };

      function _computeBootDigest(data) {
        if (!data || typeof data !== 'object') return '';
        const prof = data.store_profile || {};
        const act = data.active_shift || {};
        return [
          (data.master_obat || []).length,
          (data.stok_batch || []).length,
          (data.members || []).length,
          (data.supplier_pbf || []).length,
          (data.master_dokter || []).length,
          (data.penjualan || []).length,
          (data.faktur_pbf || []).length,
          (data.jurnal_keuangan || []).length,
          (data.rekam_klinis || []).length,
          (data.pemeriksaan_pasien || []).length,
          (data.shift_history || []).length,
          (data.surat_pesanan || []).length,
          (data.omnichannel_orders || []).length,
          act.id_shift || '',
          act.status_shift || '',
          prof.nama_usaha || '',
          prof.terkonfirmasi || '',
          prof.multi_cabang_aktif || '',
          (data.staff_directory || []).length
        ].join('|');
      }

      window.bootLoadState = async function (forceRefresh) {
        const st = ONSStore.AppState;
        const ses = ONSApi.getSession();
        if (!ses || !ses.token) return;
        st.user = ses.user;
        st.cabangId = ses.cabang_id || (ses.user && ses.user.cabang_id) || 'ONS-01';

        // SWR Instant Cache Render + Smart Freshness Guard
        const cachedEntry = (!forceRefresh && ONSApi.getCachedReadEntry)
          ? ONSApi.getCachedReadEntry('boot.getState', { cabang_id: st.cabangId })
          : null;
        const cached = cachedEntry ? cachedEntry.data : (!forceRefresh ? ONSApi.getCachedRead('boot.getState', { cabang_id: st.cabangId }) : null);
        let renderedDigest = '';
        if (cached && !forceRefresh) {
          renderedDigest = _computeBootDigest(cached);
          applyBootPayload(cached);
          st.booted = true;
          window.renderApp();
          if (cachedEntry && cachedEntry.ageMs < 20000) {
            return;
          }
        }

        try {
          const live = await ONSApi.callApi('boot.getState', { cabang_id: st.cabangId });
          const liveDigest = _computeBootDigest(live);
          const unchanged = !forceRefresh && st.booted && renderedDigest && liveDigest === renderedDigest;
          applyBootPayload(live);
          st.booted = true;
          if (!unchanged) {
            window.renderApp();
          } else if (typeof window.syncNavHighlight === 'function') {
            window.syncNavHighlight(true);
          }
        } catch (err) {
          if (!cached) toast('Gagal memuat state: ' + err.message, 'err');
        }
      };

      function syncOwnerIdentityFromProfile(prof) {
        const p = prof || (ONSStore.getStoreProfile ? ONSStore.getStoreProfile() : {});
        const st = ONSStore.AppState;
        if (!p || !p.nama_pemilik) return;
        const cleanOwner = (ONSStore.sanitizeLegacyOwnerName ? ONSStore.sanitizeLegacyOwnerName(p.nama_pemilik, 'apt. Anissa Faradifa R. Is Rumi') : p.nama_pemilik);
        if (/hendra\s+wijaya/i.test(String(p.nama_pemilik || '')) || /hendra\s+wijaya/i.test(String(p.dikonfirmasi_oleh || ''))) {
          p.nama_pemilik = cleanOwner;
          p.dikonfirmasi_oleh = cleanOwner;
          if (ONSStore.setStoreProfile) ONSStore.setStoreProfile(p);
        }
        if (!st.user) return;
        const isPemilik = st.user.role === 'Pemilik' || String(st.user.id_user || '') === 'USR-001' || String(st.user.username || '').toLowerCase() === 'pemilik';
        if (!isPemilik) return;
        const stale = /hendra\s+wijaya/i.test(String(st.user.nama_lengkap || '')) || p.terkonfirmasi === 'YA';
        if (!stale || st.user.nama_lengkap === cleanOwner) return;
        st.user.nama_lengkap = cleanOwner;
        if (p.sipa_pemilik) st.user.no_sipa = p.sipa_pemilik;
        const ses = ONSApi.getSession && ONSApi.getSession();
        if (ses && ses.user) {
          ses.user = Object.assign({}, ses.user, {
            nama_lengkap: cleanOwner,
            no_sipa: p.sipa_pemilik || ses.user.no_sipa
          });
          ONSApi.setSession(ses);
        }
      }

      window.applyBootPayload = function (data) {

          st.user = sesNow.user;

        if (typeof ONSStore.invalidateStockIndex === 'function') ONSStore.invalidateStockIndex();
        if (data.store_profile && ONSStore.setStoreProfile) ONSStore.setStoreProfile(data.store_profile);
        syncOwnerIdentityFromProfile(data.store_profile);
        st.masterObat = (data.master_obat || []).map((o) => {
          // Auto-heal: harga_umum sangat kecil tapi HPP jauh lebih besar → parsing bug
          const _hu = Number(o.harga_umum || 0);
          const _hpp = Number(o.hpp_avg || 0);
          if (_hu > 0 && _hu <= 10 && _hpp > _hu * 5) {
            const _fac = 1000;
            o.harga_umum = _hu * _fac;
            if (Number(o.harga_member || 0) <= 10) o.harga_member = Number(o.harga_member || _hu) * _fac;
            if (Number(o.harga_grosir || 0) <= 10) o.harga_grosir = Number(o.harga_grosir || _hu) * _fac;
            if (Number(o.harga_faskes || 0) <= 10) o.harga_faskes = Number(o.harga_faskes || _hu) * _fac;
          }
          return o;
        });

        st.jurnalKeuangan = data.jurnal_keuangan || [];

        st.piutangPelanggan = data.piutang_pelanggan || [];

      function buildOperationalAlerts() {
        const st = ONSStore.AppState;
        const alerts = [];
        const nearEdCount = (st.stokBatch || []).filter((b) => b.status_batch === 'AKTIF' && b.qty_sisa > 0 && ONSStore.daysUntil(b.tgl_kadaluarsa) <= 90).length;
        if (nearEdCount > 0) alerts.push({ view: 'gudang', sub: 'batch', tone: 'text-red-600', title: `${nearEdCount} Batch Kritis Near-ED (<=90 hari)`, desc: 'Prioritaskan FEFO atau Retur BAR-PBF.' });
        const lowCount = (st.masterObat || []).filter((o) => ONSStore.getTotalStok(o.id_obat) <= Number(o.stok_min || 10)).length;
        if (lowCount > 0 && ONSStore.canSeeFinancialCost()) alerts.push({ view: 'faktur', sub: 'defecta', tone: 'text-amber-600', title: `${lowCount} Obat di Bawah Stok Minimum`, desc: 'Buat SP BPOM otomatis dari menu Defecta.' });
        const erxPend = (st.rekamKlinis || []).filter((r) => r.status_klinis === 'ANTRIAN_VALIDASI_APJ').length;
        if (erxPend > 0 && ONSStore.canSeeFinancialCost()) alerts.push({ view: 'klinis', sub: 'erx', tone: 'text-blue-600', title: `${erxPend} E-Resep Menunggu PIN APJ`, desc: 'Periksa interaksi obat & verifikasi SIPA.' });
        const coldLogs = (st.coldChain || []).slice().sort((a, b) => String(a.timestamp || '').localeCompare(String(b.timestamp || '')));
        const latestCold = coldLogs.length ? coldLogs[coldLogs.length - 1] : null;
        if (latestCold && String(latestCold.status_alarm || 'NORMAL') !== 'NORMAL') {
          alerts.push({ view: 'gudang', sub: 'coldchain', tone: 'text-red-600', title: `Alarm Suhu Kulkas ${Number(latestCold.suhu_celcius || 0).toFixed(1)}°C`, desc: 'Suhu di luar rentang CDOB 2â€“8°C. Segera periksa & catat ulang.' });
        }
        return alerts;
      }

                  <span class="ons-shortcut-kbd">Esc</span><span>Tutup</span>

              <div class="ons-cmdk-searchbox">

                <span class="ons-shortcut-kbd hidden sm:inline-flex">Ctrl+K</span>

                  <div class="flex items-center justify-between pb-2 border-b" style="border-color:var(--ons-border)">
                    <span class="font-bold text-xs">Aksi Kilat Apotek (1 Klik)</span>
                    <span class="text-[10px] font-semibold" style="color:var(--ons-text-soft)">Sesuai Hak Akses</span>

                  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-1 gap-2">
                    ${quickShortcuts.map((s, idx) => `
                      <button type="button" onclick="window.runCmdkQuick(${idx})" class="ons-cmdk-quickcard">

        function renderInspectorPanel(entry) {
          const box = document.getElementById('cmdkInspectorBox');

            box.innerHTML = `<div class="py-4 text-center space-y-1" style="color:var(--ons-text-soft)">
              <div class="font-bold text-xs" style="color:var(--ons-text-main)">Pratinjau Item Terpilih</div>
              <p class="text-[11px]">Arahkan kursor atau tekan tombol panah &uarr;/&darr; untuk melihat detail cepat sebelum membuka.</p>
            </div>`;
            return;
          }
          box.innerHTML = `
            <div class="flex items-start justify-between gap-2 pb-2 border-b" style="border-color:var(--ons-border)">
              <div class="min-w-0">
                <div class="text-[10px] font-bold uppercase tracking-wider text-blue-600">${ONSStore.esc(entry.kindLabel)}</div>

              </div>
              ${entry.badgeHtml || ''}
            </div>

            ${entry.metaHtml ? `<div class="p-2.5 rounded-xl border text-[11px] space-y-1" style="background:var(--ons-bg-subtle);border-color:var(--ons-border)">${entry.metaHtml}</div>` : ''}
            <button type="button" onclick="window.execCmdkEntry(${entry.idx})" class="ons-btn ons-btn-primary w-full text-xs">Buka / Jalankan Sekarang (Enter) &rarr;</button>`;
        }

        function syncSelectionHighlight(shouldScroll) {
          const box = document.getElementById('cmdkResultsBox');
          if (box) {
            box.querySelectorAll('[data-cmdk-idx]').forEach((el) => {
              const isSel = Number(el.getAttribute('data-cmdk-idx')) === cmdkActiveIdx;
              el.classList.toggle('is-selected', isSel);
              if (isSel && shouldScroll && typeof el.scrollIntoView === 'function') {
                try { el.scrollIntoView({ block: 'nearest' }); } catch (e) {}
              }
            });
          }
          renderInspectorPanel(currentEntries[cmdkActiveIdx] || null);
        }

        window.runCmdkQuick = (idx) => {
          const item = quickShortcuts[idx];
          if (item && typeof item.run === 'function') item.run();
        };

        window.setCmdkScope = (scope) => {
          cmdkScope = scope || 'SEMUA';
          cmdkActiveIdx = 0;
          const inp = document.getElementById('cmdkSearchInp');
          window.filterCmdk(inp ? inp.value : '');
          inp?.focus();
        };

        window.clearCmdkQuery = () => {
          const inp = document.getElementById('cmdkSearchInp');
          if (inp) { inp.value = ''; inp.focus(); }
          window.filterCmdk('');
        };

        window.hoverCmdkEntry = (idx) => {
          if (cmdkActiveIdx === idx) return;
          cmdkActiveIdx = idx;
          syncSelectionHighlight(false);
        };

        window.execCmdkEntry = (idx) => {
          const target = currentEntries[idx];
          if (target && typeof target.run === 'function') target.run();
        };

        window.handleCmdkKey = (e) => {
          if (!e) return;
          if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (currentEntries.length) {
              cmdkActiveIdx = (cmdkActiveIdx + 1) % currentEntries.length;
              syncSelectionHighlight(true);
            }
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (currentEntries.length) {
              cmdkActiveIdx = (cmdkActiveIdx - 1 + currentEntries.length) % currentEntries.length;
              syncSelectionHighlight(true);
            }
          } else if (e.key === 'Enter' && currentEntries[cmdkActiveIdx]) {
            e.preventDefault();
            window.execCmdkEntry(cmdkActiveIdx);
          }
        };

        window.filterCmdk = function (rawQ) {
          const q = String(rawQ || '').trim().toLowerCase();
          const box = document.getElementById('cmdkResultsBox');
          if (!box) return;
          const clearBtn = document.getElementById('cmdkClearBtn');
          if (clearBtn) clearBtn.classList.toggle('hidden', !q);

          const navMatches = flatNav.filter((n) => !q || `${n.label} ${n.grp} ${n.sect} ${n.kw}`.toLowerCase().includes(q)).slice(0, q ? 14 : 10);
          const canSeeObat = ONSStore.canAccessView('pos') || ONSStore.canAccessView('obat');
          const obatMatches = canSeeObat ? (st.masterObat || []).filter((o) => !q || `${o.nama_dagang} ${o.zat_aktif} ${o.kode_kfa} ${o.nie_bpom} ${o.rak_lokasi}`.toLowerCase().includes(q)).slice(0, q ? 10 : 6) : [];
          const canSeePasien = ONSStore.canAccessView('obat') || ONSStore.canAccessView('pemeriksaan') || ONSStore.canAccessView('crm-wa') || ONSStore.canAccessView('klinis');
          const pasienMatches = (canSeePasien && q) ? (st.members || []).filter((m) => `${m.nama_pasien} ${m.no_hp} ${m.penyakit_kronis} ${m.program_prb}`.toLowerCase().includes(q)).slice(0, 6) : [];
          const canSeeMaster = ONSStore.canAccessView('obat');
          const supplierMatches = (canSeeMaster && seeCost && q) ? (st.supplierPbf || []).filter((p) => `${p.nama_pbf} ${p.kode_cdob} ${p.kontak_wa} ${p.email_pbf}`.toLowerCase().includes(q)).slice(0, 4) : [];
          const dokterMatches = (canSeeMaster && q) ? (st.masterDokter || []).filter((dk) => `${dk.nama_dokter} ${dk.spesialisasi} ${dk.faskes_klinik} ${dk.no_sip}`.toLowerCase().includes(q)).slice(0, 4) : [];
          const canPos = ONSStore.canAccessView('pos');
          const txPool = [];
          if (canPos) {
            (st.penjualan || []).forEach((p) => txPool.push({ kind: 'NOTA POS', id: p.no_invoice, title: p.no_invoice, sub: `${p.channel || 'Toko'} â€¢ ${p.metode_bayar || 'TUNAI'}`, nominal: p.grand_total, tone: 'bpom-bebas', viewId: 'pos', subTab: 'riwayat' }));
          }
          if (seeCost && ONSStore.canAccessView('faktur')) {
            (st.suratPesanan || []).forEach((sp) => txPool.push({ kind: 'SURAT PESANAN', id: sp.no_sp, title: sp.no_sp, sub: `${sp.nama_pbf} (${sp.golongan_sp || 'REGULER'})`, nominal: sp.estimasi_total, tone: 'bpom-terbatas', viewId: 'faktur', subTab: 'sp' }));
            (st.fakturPbf || []).forEach((fk) => txPool.push({ kind: 'FAKTUR PBF', id: fk.no_faktur_pbf, title: fk.no_faktur_pbf, sub: `${fk.id_pbf} â€¢ ${fk.status_bayar || ''}`, nominal: fk.netto_hutang, tone: 'bpom-prekursor', viewId: 'faktur', subTab: 'daftar' }));
          }
          if (ONSStore.canAccessView('omnichannel')) {
            (st.omnichannelOrders || []).forEach((o) => txPool.push({ kind: 'ORDER ONLINE', id: o.no_order, title: `${o.no_order} â€” ${o.nama_pelanggan}`, sub: `${o.channel} â€¢ ${o.status_order}`, nominal: o.total_estimasi, tone: 'bpom-terbatas', viewId: 'pos', subTab: 'kasir' }));
          }
          const txMatches = q ? txPool.filter((t) => `${t.kind} ${t.title} ${t.sub}`.toLowerCase().includes(q)).slice(0, 6) : [];

          const scopeCounts = {
            SEMUA: navMatches.length + obatMatches.length + pasienMatches.length + supplierMatches.length + dokterMatches.length + txMatches.length,
            MENU: navMatches.length,
            OBAT: obatMatches.length,
            PASIEN: pasienMatches.length + dokterMatches.length,
            TRANSAKSI: txMatches.length
          };
          const tabsEl = document.getElementById('cmdkScopeTabs');
          if (tabsEl) {
            const tabDefs = [
              { id: 'SEMUA', label: 'Semua' },
              { id: 'MENU', label: 'Menu &amp; Modul' },
              { id: 'OBAT', label: 'Obat &amp; Stok' },
              { id: 'PASIEN', label: 'Pasien &amp; Member' },
              { id: 'TRANSAKSI', label: 'Nota, SP &amp; Faktur' }

            tabsEl.innerHTML = tabDefs.map((tb) => `<button type="button" onclick="window.setCmdkScope('${tb.id}')" class="ons-cmdk-chip ${cmdkScope === tb.id ? 'active' : ''}">${tb.label} <span class="font-mono-num opacity-80">(${scopeCounts[tb.id] || 0})</span></button>`).join('');

          currentEntries = [];
          const sectionsHtml = [];
          const addEntry = (e) => {
            e.idx = currentEntries.length;
            currentEntries.push(e);
            return e.idx;
          };

          if ((cmdkScope === 'SEMUA' || cmdkScope === 'MENU') && navMatches.length) {
            sectionsHtml.push(`<div class="ons-sidebar-group-label pt-1">Menu &amp; Sub-Modul (${navMatches.length})</div>` + navMatches.map((n) => {
              const idx = addEntry({
                kindLabel: 'Menu & Navigasi',

                sub: n.grp,
                desc: `Buka halaman ${n.label} pada seksi ${n.sect}.`,
                badgeHtml: `<span class="badge-bpom bpom-terbatas">${ONSStore.esc(n.sect)}</span>`,

              });
              return `<div data-cmdk-idx="${idx}" onmouseenter="window.hoverCmdkEntry(${idx})" onclick="window.execCmdkEntry(${idx})" class="ons-cmdk-row">
                <div class="flex items-center gap-3 min-w-0">
                  <span class="ons-kpi-ico bg-blue-500/10 text-blue-600 w-9 h-9 rounded-xl">${svgIcon(n.icon, 'w-4 h-4')}</span>
                  <div class="min-w-0">
                    <div class="font-bold text-xs sm:text-sm truncate">${ONSStore.esc(n.label)}</div>

          if ((cmdkScope === 'SEMUA' || cmdkScope === 'OBAT') && obatMatches.length) {
            sectionsHtml.push(`<div class="ons-sidebar-group-label">Katalog Obat &amp; Stok FEFO (${obatMatches.length})</div>` + obatMatches.map((o) => {
              const stok = ONSStore.getSellableStok ? ONSStore.getSellableStok(o.id_obat) : ONSStore.getTotalStok(o.id_obat);
              const idx = addEntry({
                kindLabel: canPos ? 'Produk Obat -> Tambah ke Kasir' : 'Produk Master Obat',

                metaHtml: `<div class="flex justify-between"><span>Stok Layak Jual</span><b class="font-mono-num">${stok} ${ONSStore.esc(o.satuan_dasar)}</b></div>

                run: () => {

                    navigateView('pos', 'kasir');

                  </div>

                <div class="text-right shrink-0">
                  <div class="font-mono-num font-bold text-blue-600">${ONSStore.rp(o.harga_umum)}</div>

          if ((cmdkScope === 'SEMUA' || cmdkScope === 'PASIEN') && pasienMatches.length) {
            sectionsHtml.push(`<div class="ons-sidebar-group-label">Pasien &amp; Member (${pasienMatches.length})</div>` + pasienMatches.map((m) => {

              const targetSub = targetView === 'obat' ? 'pelanggan' : (targetView === 'pemeriksaan' ? 'semua' : 'kontak');
              const progLbl = ONSStore.formatMemberProgram ? ONSStore.formatMemberProgram(m.program_prb) : (m.program_prb || 'MEMBER');
              const idx = addEntry({
                kindLabel: 'Pasien & Member Apotek',
                title: m.nama_pasien,
                sub: `${progLbl} â€¢ ${m.penyakit_kronis || '-'}`,

                <div class="min-w-0">
                  <div class="font-bold text-xs sm:text-sm truncate">${ONSStore.esc(m.nama_pasien)}</div>
                  <div class="text-[11px] truncate" style="color:var(--ons-text-soft)">${ONSStore.esc(m.penyakit_kronis || progLbl || '-')} &bull; WA ${ONSStore.esc(m.no_hp || '-')}</div>

              </div>`;
            }).join(''));

          if ((cmdkScope === 'SEMUA' || cmdkScope === 'PASIEN') && (supplierMatches.length || dokterMatches.length)) {
            const partnerItems = [
              ...(cmdkScope === 'SEMUA' ? supplierMatches : []).map((p) => {
                const idx = addEntry({
                  kindLabel: 'Master Supplier PBF',
                  title: p.nama_pbf,
                  sub: `${p.kode_cdob || '-'} â€¢ TOP ${p.termin_hari}h`,

                  badgeHtml: `<span class="badge-bpom bpom-terbatas">SUPPLIER</span>`,

                return `<div data-cmdk-idx="${idx}" onmouseenter="window.hoverCmdkEntry(${idx})" onclick="window.execCmdkEntry(${idx})" class="ons-cmdk-row">
                  <div class="min-w-0">
                    <div class="font-bold text-xs truncate">${ONSStore.esc(p.nama_pbf)}</div>
                    <div class="text-[11px] truncate" style="color:var(--ons-text-soft)">${ONSStore.esc(p.kode_cdob || '-')} &bull; TOP ${Number(p.termin_hari || 0)} Hari</div>
                  </div>
                  <span class="badge-bpom bpom-terbatas shrink-0">Supplier</span>
                </div>`;
              }),
              ...dokterMatches.map((dk) => {
                const idx = addEntry({
                  kindLabel: 'Master Dokter Mitra',
                  title: dk.nama_dokter,
                  sub: `${dk.spesialisasi || 'Dokter'} â€¢ ${dk.faskes_klinik || '-'}`,
                  desc: `No. SIP: ${dk.no_sip || '-'} â€¢ WA ${dk.no_wa || '-'}`,
                  badgeHtml: `<span class="badge-bpom bpom-bebas">DOKTER</span>`,
                  run: () => { ONSStore.closeModal(); navigateView('obat', 'dokter'); }
                });
                return `<div data-cmdk-idx="${idx}" onmouseenter="window.hoverCmdkEntry(${idx})" onclick="window.execCmdkEntry(${idx})" class="ons-cmdk-row">
                  <div class="min-w-0">
                    <div class="font-bold text-xs truncate">${ONSStore.esc(dk.nama_dokter)}</div>
                    <div class="text-[11px] truncate" style="color:var(--ons-text-soft)">${ONSStore.esc(dk.spesialisasi || '-')} &bull; ${ONSStore.esc(dk.faskes_klinik || '-')}</div>
                  </div>
                  <span class="badge-bpom bpom-bebas shrink-0">Dokter</span>

              })
            ];
            if (partnerItems.length) {
              sectionsHtml.push(`<div class="ons-sidebar-group-label">${cmdkScope === 'PASIEN' ? 'Dokter Mitra' : 'Supplier &amp; Dokter Mitra'} (${partnerItems.length})</div>` + partnerItems.join(''));
            }
          }

          if ((cmdkScope === 'SEMUA' || cmdkScope === 'TRANSAKSI') && txMatches.length) {
            sectionsHtml.push(`<div class="ons-sidebar-group-label">Nota, Surat Pesanan &amp; Faktur (${txMatches.length})</div>` + txMatches.map((t) => {
              const idx = addEntry({
                kindLabel: t.kind,
                title: t.title,
                sub: t.sub,
                desc: `Nominal tercatat: ${ONSStore.rp(t.nominal)}. Klik untuk membuka halaman terkait.`,
                badgeHtml: `<span class="badge-bpom ${t.tone}">${ONSStore.esc(t.kind)}</span>`,
                run: () => { ONSStore.closeModal(); navigateView(t.viewId, t.subTab); }
              });
              return `<div data-cmdk-idx="${idx}" onmouseenter="window.hoverCmdkEntry(${idx})" onclick="window.execCmdkEntry(${idx})" class="ons-cmdk-row">
                <div class="flex items-center gap-2.5 min-w-0">
                  <span class="badge-bpom ${t.tone} shrink-0">${ONSStore.esc(t.kind)}</span>
                  <div class="min-w-0">
                    <div class="font-bold text-xs sm:text-sm truncate">${ONSStore.esc(t.title)}</div>
                    <div class="text-[11px] truncate" style="color:var(--ons-text-soft)">${ONSStore.esc(t.sub)}</div>
                  </div>
                </div>
                <span class="font-mono-num font-bold text-blue-600 shrink-0">${ONSStore.rp(t.nominal)}</span>
              </div>`;
            }).join(''));
          }

          box.innerHTML = sectionsHtml.join('') || `<div class="p-10 text-center space-y-2 rounded-xl border border-dashed" style="border-color:var(--ons-border);color:var(--ons-text-soft)">
            <div class="font-bold text-sm">Tidak ada hasil yang cocok</div>
            <p class="text-xs">Coba kata kunci lain (mis. <i>Paracetamol</i>, <i>faktur</i>, <i>tensi</i>, atau <i>retur</i>) atau ubah filter tab di atas.</p>
          </div>`;

          const countBadge = document.getElementById('cmdkResultCountBadge');
          if (countBadge) countBadge.textContent = `${currentEntries.length} item`;
          const metaEl = document.getElementById('cmdkMatchMeta');
          if (metaEl) metaEl.textContent = q ? `Menampilkan ${currentEntries.length} hasil untuk "${rawQ}"` : `${flatNav.length} rute menu & ${st.masterObat.length} produk obat siap dicari`;
          if (cmdkActiveIdx >= currentEntries.length) cmdkActiveIdx = 0;
          syncSelectionHighlight(false);
        };

        window.filterCmdk('');
        setTimeout(() => document.getElementById('cmdkSearchInp')?.focus(), 20);
      };

      window.renderApp = function () {
        if (typeof ONSStore.invalidateStockIndex === 'function') ONSStore.invalidateStockIndex();
        const root = document.getElementById('appRoot');
        if (window.ONSViewsAuthDashPos.renderPublicStandaloneIfApplicable(root)) return;

        const ses = ONSApi.getSession();
        if (!ses || !ses.token) {
          window.ONSViewsAuthDashPos.renderLoginView(root);
          return;
        }

        const st = ONSStore.AppState;
        st.user = ses.user;
        const prof = ONSStore.getStoreProfile ? ONSStore.getStoreProfile() : {};
        syncOwnerIdentityFromProfile(prof);
        const logoSrc = prof.logo_usaha_url || './icons/ons-farma-app-icon.png';
        const usahaNama = 'Apotek ONS Farma';
        const fotoPem = prof.foto_pemilik_url || '';
        const alertsCount = buildOperationalAlerts().length;
        const cleanWords = String((st.user && st.user.nama_lengkap) || 'OF')
          .replace(/^(apt|dr|drg|prof|hj|h)\.?\s+/i, '')
          .trim()
          .split(/\s+/)
          .filter(Boolean);
        const initials = cleanWords.length >= 2
          ? (cleanWords[0][0] + cleanWords[1][0]).toUpperCase()
          : String(cleanWords[0] || 'OF').slice(0, 2).toUpperCase();

        root.innerHTML = `
          <div class="min-h-screen flex flex-col md:flex-row">
            <!-- Sidebar Desktop Menu Terstruktur v17.7 -->
            <aside id="desktopSidebar" class="ons-sidebar ${sidebarCollapsed ? 'collapsed' : ''} shrink-0 p-2.5 flex flex-col justify-between ons-desktop-only sticky top-0 h-screen overflow-y-auto">
              <div>
                <div class="ons-sb-brand-row flex items-center justify-between gap-2 px-1 py-2 mb-1.5 border-b border-white/20">
                  <div class="flex items-center gap-2.5 min-w-0">
                    <div class="w-9 h-9 rounded-full bg-white p-1 shrink-0 flex items-center justify-center shadow-md">
                      <img src="${ONSStore.esc(logoSrc)}" alt="Logo" class="w-7 h-7 rounded-full object-cover"/>
                    </div>
                    <div class="min-w-0 ons-hide-collapsed">
                      <div class="font-extrabold text-[14px] text-white tracking-wide truncate">Apotek ONS Farma</div>
                    </div>
                  </div>
                  <button onclick="window.toggleSidebarCollapsed()" aria-label="Perkecil atau Perlebar Sidebar" title="Perkecil / Perlebar Menu" class="p-1 rounded-lg text-white/80 hover:bg-white/15 hover:text-white shrink-0">
                    ${svgIcon('collapse', 'ons-collapse-ico')}
                  </button>
                </div>
                <div class="px-1 py-1.5 ons-hide-collapsed">
                  <div class="relative">
                    <input type="text" id="sidebarSearchInp" oninput="window.filterSidebarMenu(this.value)" onkeydown="window.handleSidebarSearchKey(event, this.value)" placeholder="Cari fitur disini" autocomplete="off" class="ons-sb-search-pill ons-input text-xs pl-8 pr-7 py-2 rounded-full w-full text-slate-900 focus:outline-none"/>
                    <svg class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-2.5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    <button type="button" id="sidebarSearchClearBtn" onclick="window.clearSidebarSearch()" aria-label="Bersihkan pencarian" class="hidden absolute right-2 top-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-0.5 rounded-full" title="Bersihkan">
                      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                    <div id="sidebarSearchResults" class="hidden absolute left-0 right-0 top-full mt-1 bg-white dark:bg-slate-900 rounded-xl shadow-2xl border border-slate-200/90 dark:border-slate-700/90 z-50 overflow-hidden max-h-72 overflow-y-auto"></div>
                  </div>
                </div>
                <nav id="sidebarMenuMount" aria-label="Menu Utama Apotek" class="space-y-0.5">
                  ${renderMenuTreeHtml()}
                </nav>
              </div>
              <div class="pt-2 mt-2 border-t ons-nav-divider space-y-1.5 text-xs">
                <button type="button" onclick="navigateView('settings','profil')" class="w-full flex items-center gap-2 px-1.5 py-1 rounded-lg ons-nav-profile-btn text-left ons-hide-collapsed" title="Lihat & Konfirmasi Profil Pemilik">
                  ${(fotoPem && ONSStore.getRole() === 'Pemilik')
                    ? `<img src="${ONSStore.esc(fotoPem)}" alt="Foto" class="w-7 h-7 rounded-full object-cover border border-blue-500 shrink-0"/>`
                    : `<span class="w-7 h-7 rounded-full bg-blue-600 text-white font-bold text-[10px] flex items-center justify-center shrink-0">${ONSStore.esc(initials)}</span>`}
                  <div class="min-w-0">
                    <div class="ons-nav-profile-name font-semibold text-xs truncate">${ONSStore.esc(st.user.nama_lengkap)}</div>
                    <div class="text-[10px] ons-nav-profile-status font-medium truncate">${prof.terkonfirmasi === 'YA' ? 'Profil Terkonfirmasi' : 'Lengkapi Profil Usaha'}</div>
                  </div>
                </button>
                <button onclick="logoutUser()" title="Keluar Sesi" class="ons-nav-btn ons-nav-logout-btn py-1.5 min-h-[32px]">
                  ${svgIcon('logout')}
                  <span class="ons-hide-collapsed">Keluar Sesi</span>
                </button>
              </div>
            </aside>

            <!-- Konten Utama -->
            <div class="flex-1 flex flex-col min-w-0">
              <header class="ons-topbar h-14 border-b px-3 sm:px-4 flex items-center justify-between gap-2 sticky top-0 z-30 shadow-sm" style="background:#0066D6;color:#FFFFFF;border-color:rgba(255,255,255,0.18)">
                <div class="flex items-center gap-2.5 sm:gap-3 min-w-0 text-white">
                  <button onclick="window.openMobileDrawer ? window.openMobileDrawer() : window.toggleSidebarCollapsed()" aria-label="Buka Daftar Menu Apotek" class="ons-btn ons-btn-ghost p-1.5 w-9 h-9 rounded-lg text-white hover:bg-white/20 border-0 md:hidden flex items-center justify-center shadow-sm" style="background:rgba(255,255,255,0.15);color:#FFFFFF">${svgIcon('menu', 'w-5 h-5')}</button>
                  <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-white/15 text-white border border-white/25 shadow-sm">
                    <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                    <span class="font-bold tracking-wide">Apotek ONS Farma</span>
                  </div>
                  <span class="badge-bpom ${ONSApi.isDemoMode() ? 'bpom-terbatas' : 'bpom-bebas'} hidden lg:inline-block">${ONSApi.isDemoMode() ? 'DEMO SANDBOX' : 'LIVE'}</span>
                </div>
                <div class="flex items-center gap-1.5 sm:gap-2 text-white">
                  <button onclick="window.openCommandPalette()" aria-label="Pencarian Cepat dan Pintasan Navigasi" class="ons-btn ons-btn-ghost text-xs px-2.5 py-1.5 rounded-lg text-white hover:bg-white/25 flex items-center gap-1.5 shadow-sm" style="background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.22);color:#FFFFFF" title="Pencarian Cepat &amp; Pintasan Fitur (Ctrl+K)">
                    ${svgIcon('search', 'w-3.5 h-3.5 text-white')}
                    <span class="font-semibold text-white">Cari Cepat</span>
                    <kbd class="hidden md:inline ml-0.5 px-1 py-0.5 text-[10px] rounded bg-white/20 border border-white/20 text-white font-mono">Ctrl+K</kbd>
                  </button>
                  <div id="headerAlertHost" class="relative">
                    <button onclick="window.toggleHeaderAlerts()" aria-label="Radar Notifikasi Apotek" class="ons-btn ons-btn-ghost text-xs p-2 rounded-lg text-white hover:bg-white/25 flex items-center justify-center relative shadow-sm" style="background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.22);color:#FFFFFF" title="Radar Notifikasi Apotek">
                      ${svgIcon('bell', 'w-4 h-4')}
                      ${alertsCount ? `<span class="px-1.5 py-0.2 rounded-full bg-red-600 text-white text-[10px] font-bold absolute -top-1 -right-1 shadow-sm">${alertsCount}</span>` : ''}
                    </button>
                  </div>
                  <button type="button" onclick="window.renderApp();window.toast && window.toast('Data berhasil disegarkan','ok')" class="ons-btn ons-btn-ghost text-xs p-2 rounded-lg text-white hover:bg-white/25 flex items-center justify-center shadow-sm" style="background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.22);color:#FFFFFF" title="Segarkan Data">
                    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                  </button>
                  <button id="pwaInstallBtn" onclick="window.triggerPwaInstall()" class="ons-btn ons-btn-primary text-xs hidden font-bold">Install</button>
                  <button onclick="window.lockScreenNow()" aria-label="Kunci Layar dan Hapus Cache Sesi" title="Kunci Layar Segera" class="ons-btn ons-btn-ghost text-xs px-2.5 py-1.5 rounded-lg text-white hover:bg-white/25 flex items-center gap-1 shadow-sm" style="background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.22);color:#FFFFFF">${svgIcon('shield', 'w-4 h-4')}<span class="hidden xl:inline text-white font-medium">Kunci</span></button>
                  <button onclick="ONSStore.toggleDarkMode();renderApp();" aria-label="Ganti Tema Terang atau Malam" class="ons-btn ons-btn-ghost text-xs p-2 rounded-lg text-white hover:bg-white/25 flex items-center justify-center shadow-sm" style="background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.22);color:#FFFFFF" title="Tema">${st.darkMode ? svgIcon('sun', 'w-4 h-4') : svgIcon('moon', 'w-4 h-4')}</button>
                  <button type="button" onclick="navigateView('settings','profil')" class="w-7 h-7 rounded-full bg-white text-blue-700 font-bold text-xs flex items-center justify-center border border-white/80 shrink-0 ml-1 shadow-sm" title="Profil Anissa Faradifa">
                    ${(fotoPem && ONSStore.getRole() === 'Pemilik')
                      ? `<img src="${ONSStore.esc(fotoPem)}" alt="Foto" class="w-full h-full rounded-full object-cover"/>`
                      : 'AF'}
                  </button>
                </div>
              </header>

              <!-- Breadcrumb & Sub-Menu Kontekstual Cepat -->
              <div id="workspaceSubnavBar" class="ons-subnav-bar">${renderSubnavBarHtml()}</div>

              <main id="mainViewSlot" class="flex-1 p-3 sm:p-4 md:p-6 ons-main-scroll"></main>
            </div>

            <!-- Mobile Bottom Nav (<768px) dengan Touch Target >=44px & Drawer Menu -->
            <nav aria-label="Navigasi Cepat Mobile" class="ons-mobile-only fixed bottom-0 inset-x-0 border-t z-40 grid grid-cols-5 ons-mobile-bottom">
              ${[
                { id: 'dashboard', l: 'Beranda', i: 'home' },
                { id: 'pos', l: 'Kasir', i: 'pos' },
                { id: 'gudang', l: 'Stok', i: 'inventory' },
                { id: 'klinis', l: 'Klinis', i: 'clinical' },
                { id: 'keuangan', l: 'Keuangan', i: 'finance' }
              ].map((b) => `<button data-mobile-nav="${b.id}" onclick="navigateView('${b.id}')" class="ons-mobile-nav-btn flex flex-col items-center justify-center min-h-[44px] text-[11px] font-semibold ${st.activeView === b.id ? 'is-active' : ''}">
                ${svgIcon(b.i, 'w-5 h-5')}<span class="mt-0.5">${b.l}</span>
              </button>`).join('')}
              <button onclick="window.openMobileDrawer()" aria-label="Buka Semua Menu" class="ons-mobile-nav-btn flex flex-col items-center justify-center min-h-[44px] text-[11px] font-semibold">
                ${svgIcon('menu', 'w-5 h-5')}<span class="mt-0.5">Menu</span>
              </button>
            </nav>
          </div>
        `;
        window.renderActiveView();
      };

      // Hotkey POS & Global Command Palette (F2 scan, F4 Tunai, F8 QRIS, F9 Hold Antrean, Esc tutup, Ctrl+K Command)
      window.addEventListener('keydown', (e) => {
        if (!ONSApi.getSession()) return;
        if (e.key === 'Escape') {
          ONSStore.closeModal();
          ONSStore.closeDrawer();
          return;
        }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          const curInp = document.getElementById('cmdkSearchInp');
          if (curInp) { curInp.focus(); curInp.select && curInp.select(); }
          else window.openCommandPalette();
          return;
        }
        if (e.key === 'F2') {
          e.preventDefault();
          window.navigateView('pos');
          setTimeout(() => document.getElementById('posSearchInput')?.focus(), 40);
          return;
        }
        if (ONSStore.AppState.activeView === 'pos' && !document.getElementById('onsModalRoot')) {
          if (e.key === 'F4' && typeof window.posQuickCheckoutShortcut === 'function') {
            e.preventDefault();
            window.posQuickCheckoutShortcut('TUNAI');
            return;
          }
          if (e.key === 'F8' && typeof window.posQuickCheckoutShortcut === 'function') {
            e.preventDefault();
            window.posQuickCheckoutShortcut('QRIS');
            return;
          }
          if (e.key === 'F9' && typeof window.openHoldCartModal === 'function') {
            e.preventDefault();
            window.openHoldCartModal();
          }
        }
      });

      // PWA Install Prompt
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        ONSStore.AppState.deferredInstallPrompt = e;
        document.getElementById('pwaInstallBtn')?.classList.remove('hidden');
      });

      window.triggerPwaInstall = async () => {
        const promptEv = ONSStore.AppState.deferredInstallPrompt;
        if (promptEv) {
          promptEv.prompt();
          await promptEv.userChoice;
          ONSStore.AppState.deferredInstallPrompt = null;
        } else {
          toast('Gunakan menu browser (Add to Home Screen / Install App) untuk memasang PWA.', 'info');
        }
      };

      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        let swReloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (swReloading) return;
          swReloading = true;
          location.reload();
        });
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          if (reg && typeof reg.update === 'function') reg.update().catch(() => {});
        }).catch(() => {});
      }

      // Kunci Sesi Otomatis saat idle >= 25 menit pada Mode Live GAS (cegah penyalahgunaan PC bersama)
      let lastUserActivityMs = Date.now();
      const bumpActivity = () => { lastUserActivityMs = Date.now(); };
      ['pointerdown', 'keydown', 'scroll', 'touchstart'].forEach((ev) => {
        window.addEventListener(ev, bumpActivity, { passive: true });
      });
      if (typeof setInterval === 'function') {
        setInterval(() => {
          if (!ONSApi.isDemoMode() && ONSApi.getSession() && (Date.now() - lastUserActivityMs > 25 * 60 * 1000)) {
            lastUserActivityMs = Date.now();
            window.logoutUser('Sesi dikunci otomatis karena tidak ada aktivitas selama 25 menit.');
          }
        }, 60 * 1000);
      }

      // Reset Data Pabrik Otomatis untuk Fresh Start Bersih (Transaksional 100% Kosong, Akun, Struk & Log Terjaga)
      try {
        const resetKey = 'ons_v18_1_clean_reset_done';
        if (localStorage.getItem(resetKey) !== '1') {
          if (window.ONSDemoEngine && typeof window.ONSDemoEngine.cleanFactoryReset === 'function') {
            window.ONSDemoEngine.cleanFactoryReset(true);
          }
          [
            'ons_lost_sales_v10', 'ons_lost_sales_v1', 'ons_pos_lost_sales',
            'ONS_MANUAL_UTANG_V1', 'ONS_MANUAL_PIUTANG_V1', 'ONS_TTF_PIUTANG_V1',
            'ONS_PURCHASE_PLANS_V1', 'ONS_FAKTUR_DRAFTS_V1', 'ONS_KONSINYASI_DRAFTS_V1',
            'ONS_RETUR_DRAFTS_V1', 'ONS_SP_DRAFTS_V1', 'ons_sp_drafts_v1',
            'ons_farma_offline_queue', 'ons_farma_v10_offline_queue'
          ].forEach((k) => {
            try { localStorage.removeItem(k); } catch (_) {}
          });
          if (window.ONSApi && typeof window.ONSApi.clearCachedReads === 'function') {
            window.ONSApi.clearCachedReads();
          }
          localStorage.setItem(resetKey, '1');
        }
      } catch (e) {}

      // ── Patch harga rusak di localStorage demo (bug Number("5.000")) ──────
      try {
        const _DEMO_KEY = 'ons_farma_v10_demo_db';
        const _raw = localStorage.getItem(_DEMO_KEY);
        if (_raw) {
          const _db = JSON.parse(_raw);
          let _healChanged = false;
          if (Array.isArray(_db.master_obat)) {
            _db.master_obat.forEach(function(_o) {
              const _hu = Number(_o.harga_umum || 0);
              const _hpp = Number(_o.hpp_avg || 0);
              if (_hu > 0 && _hu <= 10 && _hpp > _hu * 5) {
                const _fac = 1000;
                _o.harga_umum = _hu * _fac;
                if (Number(_o.harga_member || 0) <= 10) _o.harga_member = Number(_o.harga_member || _hu) * _fac;
                if (Number(_o.harga_grosir || 0) <= 10) _o.harga_grosir = Number(_o.harga_grosir || _hu) * _fac;
                if (Number(_o.harga_faskes || 0) <= 10) _o.harga_faskes = Number(_o.harga_faskes || _hu) * _fac;
                _healChanged = true;
              }
            });
          }
          if (_healChanged) localStorage.setItem(_DEMO_KEY, JSON.stringify(_db));
        }
      } catch (_e) {}
      // ─────────────────────────────────────────────────────────────────────

      window.renderApp();
      if (ONSApi.getSession()) window.bootLoadState(false);
    })();
  </script>
</body>
</html>
