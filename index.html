      function getMenuBadges() {
        const st = ONSStore.AppState;
        const nearEd = (st.stokBatch || []).filter((b) => b.status_batch === 'AKTIF' && b.qty_sisa > 0 && ONSStore.daysUntil(b.tgl_kadaluarsa) <= 90).length;
        const lowStock = ONSStore.canSeeFinancialCost()
          ? (st.masterObat || []).filter((o) => ONSStore.getTotalStok(o.id_obat) <= Number(o.stok_min || 10)).length
          : 0;
        const erxPending = ONSStore.canSeeFinancialCost()
          ? (st.rekamKlinis || []).filter((r) => r.status_klinis === 'ANTRIAN_VALIDASI_APJ').length
          : 0;
        return { nearEd, lowStock, invAlerts: nearEd + lowStock, erxPending };
      }

      function getAllowedMenuTree() {
        const tree = [];
        const curRole = ONSStore.getRole();
        MENU_TREE.forEach((sect) => {
          const allowedItems = [];
          (sect.items || []).forEach((item) => {
            if (!ONSStore.canAccessView(item.viewId)) return;
            if (item.roles && !item.roles.includes(curRole)) return;
            const filteredTabs = (item.tabs || []).filter((t) => !t.roles || t.roles.includes(curRole));
            allowedItems.push(Object.assign({}, item, { tabs: filteredTabs }));
          });
          if (allowedItems.length) tree.push(Object.assign({}, sect, { items: allowedItems }));
        });
        return tree;
      }

      let sidebarCollapsed = localStorage.getItem(SIDEBAR_MINI_KEY) === '1';
      let openSubmenus = new Set([ONSStore.AppState.activeView || 'dashboard']);
      try {
        const savedSubs = JSON.parse(localStorage.getItem(OPEN_GROUPS_KEY) || 'null');
        if (Array.isArray(savedSubs)) openSubmenus = new Set(savedSubs);
      } catch (e) {}

      function persistOpenSubmenus() {
        try { localStorage.setItem(OPEN_GROUPS_KEY, JSON.stringify(Array.from(openSubmenus))); } catch (e) {}
      }

      window.toggleMenuSub = function (viewId) {
        if (!viewId) return;
        const willOpen = !openSubmenus.has(viewId);
        if (willOpen) openSubmenus.add(viewId);
        else openSubmenus.delete(viewId);
        persistOpenSubmenus();

        const wraps = document.querySelectorAll('[data-subwrap-id="' + viewId + '"]');
        const carets = document.querySelectorAll('[data-subcaret-id="' + viewId + '"]');
        if (wraps && wraps.length) {
          wraps.forEach((w) => w.classList.toggle('is-open', willOpen));
          carets.forEach((c) => c.setAttribute('aria-expanded', willOpen ? 'true' : 'false'));
        } else {
          window.syncNavHighlight();
        }
      };

      window.toggleAllSubmenus = function (expandAll) {
        const tree = getAllowedMenuTree();
        const tabViews = [];
        tree.forEach((s) => s.items.forEach((it) => { if ((it.tabs || []).length > 1) tabViews.push(it.viewId); }));
        const hasOpen = openSubmenus.size > 0;
        const nextExpand = typeof expandAll === 'boolean' ? expandAll : !hasOpen;
        openSubmenus = new Set(nextExpand ? tabViews : []);
        persistOpenSubmenus();
        window.syncNavHighlight();
      };

      window.onSelectMenuItem = function (viewId, defSub, hasTabs) {
        if (hasTabs) {
          openSubmenus.add(viewId);
          persistOpenSubmenus();
        }
        window.navigateView(viewId, defSub || '');
      };

      function findActiveSectionAndItem() {
        const st = ONSStore.AppState;
        const tree = getAllowedMenuTree();
        for (const sect of tree) {
          for (const item of sect.items) {
            if (item.viewId === st.activeView) return { sect, item };
          }
        }

      function renderMenuTreeHtml() {
        const tree = getAllowedMenuTree();
        const badges = getMenuBadges();
        const st = ONSStore.AppState;
        const curView = st.activeView;
        const allTabViewsCount = tree.reduce((n, s) => n + s.items.filter((i) => (i.tabs || []).length > 1).length, 0);
        const topToggle = allTabViewsCount > 0 ? `<div class="flex items-center justify-between px-2 pb-1 text-[10px] ons-nav-muted ons-hide-collapsed">
          <span class="uppercase tracking-wider font-bold">Navigasi Modul</span>
          <button type="button" onclick="window.toggleAllSubmenus()" class="px-1.5 py-0.5 rounded ons-nav-all-btn font-semibold" title="Buka atau tutup semua sub-menu">${openSubmenus.size > 0 ? 'Tutup Sub' : 'Buka Semua'}</button>
        </div>` : '';

        return topToggle + tree.map((sect) => `
          <div class="ons-menu-section">
            <div class="ons-nav-section-title">
              <span>${ONSStore.esc(sect.label)}</span>
            </div>
            <div class="space-y-0.5">
              ${sect.items.map((item) => {
                const isAct = curView === item.viewId;
                const bVal = item.badgeKey ? Number(badges[item.badgeKey] || 0) : 0;

                const hasTabs = tabs.length > 1;

                const isOpen = hasTabs && openSubmenus.has(item.viewId);

                return `<div class="ons-nav-group">
                  <div class="ons-nav-row ${isAct ? 'active' : ''}">
                    <button type="button"
                      data-nav-id="${item.viewId}"
                      title="${ONSStore.esc(item.label)}"
                      onclick="window.onSelectMenuItem('${item.viewId}','${defSub}',${hasTabs})"
                      class="ons-nav-row-btn">
                      ${svgIcon(item.icon)}
                      <span class="truncate ons-hide-collapsed">${ONSStore.esc(item.label)}</span>
                    </button>
                    ${bVal > 0 ? `<span class="ons-nav-badge ons-hide-collapsed ${item.badgeTone || ''}">${bVal}</span>` : ''}
                    ${hasTabs ? `<button type="button"
                      data-subcaret-id="${item.viewId}"
                      aria-label="Buka atau tutup sub-menu ${ONSStore.esc(item.label)}"
                      aria-expanded="${isOpen ? 'true' : 'false'}"
                      onclick="window.toggleMenuSub('${item.viewId}')"
                      class="ons-nav-caret ons-hide-collapsed"

                      ${svgIcon('chevron', 'ons-chevron-sub')}

                  ${hasTabs ? `<div data-subwrap-id="${item.viewId}" class="ons-nav-subwrap ${isOpen ? 'is-open' : ''}">
                    <div class="ons-nav-subinner">
                      <div class="ons-submenu-list">
                        ${tabs.map((t) => {
                          const subAct = isAct && curSub === t.subTab;
                          return `<button type="button"
                            data-subnav-id="${item.viewId}:${t.subTab}"
                            onclick="navigateView('${item.viewId}','${t.subTab}')"
                            class="ons-submenu-btn ${subAct ? 'active' : ''}">
                            <span class="flex items-center gap-2 min-w-0">
                              <span class="ons-submenu-dot"></span>
                              <span class="truncate">${ONSStore.esc(t.label)}</span>
                            </span>
                          </button>`;
                        }).join('')}
                      </div>
                    </div>
                  </div>` : ''}
                </div>`;
              }).join('')}
            </div>
          </div>`).join('');

      function renderSubnavBarHtml() {
        const { sect, item } = findActiveSectionAndItem();
        if (!item) return '';
        const st = ONSStore.AppState;
        const tabs = item.tabs || [];
        const curSub = (st.subTabs && st.subTabs[item.viewId]) || (tabs[0] && tabs[0].subTab) || '';
        const activeTab = tabs.find((t) => t.subTab === curSub) || tabs[0] || null;

        const trail = activeTab
          ? `<span>${ONSStore.esc(sect.label)}</span> <span class="opacity-40 mx-1">/</span> <span>${ONSStore.esc(item.label)}</span> <span class="opacity-40 mx-1">/</span> <strong style="color:var(--ons-text-main)">${ONSStore.esc(activeTab.label)}</strong>`
          : `<span>${ONSStore.esc(sect.label)}</span> <span class="opacity-40 mx-1">/</span> <strong style="color:var(--ons-text-main)">${ONSStore.esc(item.label)}</strong>`;

        const chipsHtml = tabs.length > 1 ? `
          <div class="ons-subnav-ribbon mt-2" role="navigation" aria-label="Sub-tab ${ONSStore.esc(item.label)}">

        return `<div class="flex flex-wrap items-center justify-between gap-2 text-xs" style="color:var(--ons-text-soft)">

      window.navigateView = function (viewId, subTab) {
        if (viewId === 'omnichannel') { viewId = 'pos'; subTab = 'kasir'; }
        if (viewId === 'pos' && subTab === 'online') subTab = 'kasir';
        if (viewId === 'gudang' && subTab === 'coldchain') subTab = 'batch';
        if (!ONSStore.canAccessView(viewId)) {
          toast('Akses dibatasi untuk peran ' + ONSStore.getRole(), 'warn');
          return;
        }
        const st = ONSStore.AppState;
        st.activeView = viewId;
        openSubmenus.add(viewId);
        persistOpenSubmenus();
        if (subTab !== undefined && subTab !== '') {
          if (!st.subTabs) st.subTabs = {};
          st.subTabs[viewId] = subTab;
          st.activeSubTab = subTab;
          const setterMap = {
            pos: window.setPosSubTab,
            gudang: window.setGudangTab,
            defecta: window.setDefectaTab,
            faktur: window.setFakturTab,
            klinis: window.setKlinisTab,
            'eresep-prb': window.setEresepTab,
            pemeriksaan: window.setPemeriksaanTab,
            finance: window.setFinanceTab,
            sipnap: window.setSipnapTab,
            billing: window.setBillingTab,
            'doc-engine': window.setDocTab,
            settings: window.setSettingsTab
          };
          if (typeof setterMap[viewId] === 'function') {
            setterMap[viewId](subTab);
            window.closeMobileDrawer();
            return;
          }
          if (viewId === 'crm-wa' && window.ONSViewsOmniCrm && typeof window.ONSViewsOmniCrm.setCrmTab === 'function') {
            window.ONSViewsOmniCrm.setCrmTab(subTab);
            window.closeMobileDrawer();

        window.closeMobileDrawer();
        window.renderActiveView();
        window.syncNavHighlight();
      };

      window.bootLoadState = async function (forceRefresh) {
        const st = ONSStore.AppState;
        const ses = ONSApi.getSession();
        if (!ses || !ses.token) return;
        st.user = ses.user;
        st.cabangId = ses.cabang_id || (ses.user && ses.user.cabang_id) || 'ONS-01';

        // SWR Instant Cache Render
        const cached = ONSApi.getCachedRead('boot.getState', { cabang_id: st.cabangId });
        if (cached && !forceRefresh) {
          applyBootPayload(cached);
          window.renderApp();
        }

        try {
          const live = await ONSApi.callApi('boot.getState', { cabang_id: st.cabangId });
          applyBootPayload(live);
          st.booted = true;
          window.renderApp();
        } catch (err) {
          if (!cached) toast('Gagal memuat state: ' + err.message, 'err');
        }
      };

      function syncOwnerIdentityFromProfile(prof) {
        const p = prof || (ONSStore.getStoreProfile ? ONSStore.getStoreProfile() : {});
        const st = ONSStore.AppState;
        if (!p || !p.nama_pemilik) return;
        const cleanOwner = (ONSStore.sanitizeLegacyOwnerName ? ONSStore.sanitizeLegacyOwnerName(p.nama_pemilik, 'apt. Anissa Faradifa R. Is Rumi') : p.nama_pemilik);
        if (/hendra\s+wijaya/i.test(String(p.nama_pemilik || '')) || /hendra\s+wijaya/i.test(String(p.dikonfirmasi_oleh || ''))) {
          p.nama_pemilik = cleanOwner;
          p.dikonfirmasi_oleh = cleanOwner;
          if (ONSStore.setStoreProfile) ONSStore.setStoreProfile(p);
        }
        if (!st.user) return;
        const isPemilik = st.user.role === 'Pemilik' || String(st.user.id_user || '') === 'USR-001' || String(st.user.username || '').toLowerCase() === 'pemilik';
        if (!isPemilik) return;
        const stale = /hendra\s+wijaya/i.test(String(st.user.nama_lengkap || '')) || p.terkonfirmasi === 'YA';
        if (!stale || st.user.nama_lengkap === cleanOwner) return;
        st.user.nama_lengkap = cleanOwner;
        if (p.sipa_pemilik) st.user.no_sipa = p.sipa_pemilik;
        const ses = ONSApi.getSession && ONSApi.getSession();
        if (ses && ses.user) {
          ses.user = Object.assign({}, ses.user, {
            nama_lengkap: cleanOwner,
            no_sipa: p.sipa_pemilik || ses.user.no_sipa
          });
          ONSApi.setSession(ses);
        }
      }

      function buildOperationalAlerts() {
        const st = ONSStore.AppState;
        const alerts = [];
        const nearEdCount = (st.stokBatch || []).filter((b) => b.status_batch === 'AKTIF' && b.qty_sisa > 0 && ONSStore.daysUntil(b.tgl_kadaluarsa) <= 90).length;
        if (nearEdCount > 0) alerts.push({ view: 'gudang', sub: 'batch', tone: 'text-red-600', title: `${nearEdCount} Batch Kritis Near-ED (<=90 hari)`, desc: 'Prioritaskan FEFO atau Retur BAR-PBF.' });
        const lowCount = (st.masterObat || []).filter((o) => ONSStore.getTotalStok(o.id_obat) <= Number(o.stok_min || 10)).length;
        if (lowCount > 0 && ONSStore.canSeeFinancialCost()) alerts.push({ view: 'defecta', sub: 'order', tone: 'text-amber-600', title: `${lowCount} Obat di Bawah Stok Minimum`, desc: 'Buat SP BPOM otomatis dari menu Defecta.' });
        const erxPend = (st.rekamKlinis || []).filter((r) => r.status_klinis === 'ANTRIAN_VALIDASI_APJ').length;
        if (erxPend > 0 && ONSStore.canSeeFinancialCost()) alerts.push({ view: 'eresep-prb', sub: 'erx', tone: 'text-blue-600', title: `${erxPend} E-Resep Menunggu PIN APJ`, desc: 'Periksa interaksi obat & verifikasi SIPA.' });
        return alerts;
      }

        window.filterCmdk = function (rawQ) {
          const q = String(rawQ || '').trim().toLowerCase();
          const box = document.getElementById('cmdkResultsBox');

          const navMatches = flatNav.filter((n) => !q || `${n.label} ${n.grp} ${n.kw}`.toLowerCase().includes(q)).slice(0, 9);
          const obatMatches = q ? (st.masterObat || []).filter((o) => `${o.nama_dagang} ${o.zat_aktif} ${o.kode_kfa}`.toLowerCase().includes(q)).slice(0, 5) : [];

          let html = navMatches.map((n) => `

              <div class="flex items-center gap-2">${svgIcon(n.icon, 'opacity-70')}<strong>${ONSStore.esc(n.label)}</strong></div>
              <span class="text-[11px]" style="color:var(--ons-text-soft)">${ONSStore.esc(n.grp)}</span>

            html += `<div class="ons-sidebar-group-label">Stok Obat &amp; Tambah ke Kasir</div>` + obatMatches.map((o) => `

                <span class="font-mono-num font-bold text-emerald-600">${ONSStore.rp(o.harga_umum)}</span>
              </div>`).join('');
          }
          box.innerHTML = html || '<div class="p-6 text-center opacity-60">Tidak ada hasil yang cocok.</div>';
        };
        window.filterCmdk('');
        setTimeout(() => document.getElementById('cmdkSearchInp')?.focus(), 20);
      };

        const ses = ONSApi.getSession();
        if (!ses || !ses.token) {
          window.ONSViewsAuthDashPos.renderLoginView(root);
          return;
        }

        const st = ONSStore.AppState;
        st.user = ses.user;
        const prof = ONSStore.getStoreProfile ? ONSStore.getStoreProfile() : {};
        syncOwnerIdentityFromProfile(prof);
        const logoSrc = prof.logo_usaha_url || './icons/ons-farma-app-icon.png';
        const usahaNama = prof.nama_usaha || 'Apotek ONS Farma';
        const fotoPem = prof.foto_pemilik_url || '';
        const alertsCount = buildOperationalAlerts().length;
        const cleanWords = String((st.user && st.user.nama_lengkap) || 'OF')
          .replace(/^(apt|dr|drg|prof|hj|h)\.?\s+/i, '')
          .trim()
          .split(/\s+/)
          .filter(Boolean);
        const initials = cleanWords.length >= 2
          ? (cleanWords[0][0] + cleanWords[1][0]).toUpperCase()
          : String(cleanWords[0] || 'OF').slice(0, 2).toUpperCase();

        root.innerHTML = `
          <div class="min-h-screen flex flex-col md:flex-row">
            <!-- Sidebar Desktop Menu Terstruktur v13.0 -->
            <aside id="desktopSidebar" class="ons-sidebar ${sidebarCollapsed ? 'collapsed' : ''} shrink-0 p-3 flex flex-col justify-between ons-desktop-only sticky top-0 h-screen overflow-y-auto">
              <div>
                <div class="flex items-center justify-between gap-2 px-1.5 py-2 mb-1.5 border-b ons-nav-divider">
                  <div class="flex items-center gap-2.5 min-w-0">
                    <img src="${ONSStore.esc(logoSrc)}" alt="Logo" class="w-9 h-9 rounded-lg object-cover ons-nav-logo-box p-0.5 shrink-0"/>
                    <div class="min-w-0 ons-hide-collapsed">
                      <div class="font-bold text-sm ons-nav-brand-title truncate">${ONSStore.esc(usahaNama)}</div>
                      <div class="text-[11px] ons-nav-brand-sub font-medium truncate">${ONSStore.esc(st.cabangId)} &bull; ${ONSStore.esc(ONSStore.getRole())}</div>
                    </div>
                  </div>
                  <button onclick="window.toggleSidebarCollapsed()" aria-label="Perkecil atau Perlebar Sidebar" title="Perkecil / Perlebar Menu" class="p-1.5 rounded-lg ons-nav-icon-btn shrink-0">
                    ${svgIcon('collapse', 'ons-collapse-ico')}
                  </button>
                </div>
                <nav id="sidebarMenuMount" aria-label="Menu Utama Apotek" class="space-y-1">
                  ${renderMenuTreeHtml()}
                </nav>
              </div>
              <div class="pt-3 mt-3 border-t ons-nav-divider space-y-2 text-xs">
                <button type="button" onclick="navigateView('settings','profil')" class="w-full flex items-center gap-2.5 px-2 py-1.5 rounded-lg ons-nav-profile-btn text-left ons-hide-collapsed" title="Lihat & Konfirmasi Profil Pemilik">
                  ${(fotoPem && ONSStore.getRole() === 'Pemilik')
                    ? `<img src="${ONSStore.esc(fotoPem)}" alt="Foto" class="w-8 h-8 rounded-full object-cover border border-blue-500 shrink-0"/>`
                    : `<span class="w-8 h-8 rounded-full bg-blue-600 text-white font-bold text-[11px] flex items-center justify-center shrink-0">${ONSStore.esc(initials)}</span>`}
                  <div class="min-w-0">
                    <div class="ons-nav-profile-name font-semibold truncate">${ONSStore.esc(st.user.nama_lengkap)}</div>
                    <div class="text-[10px] ons-nav-profile-status font-medium truncate">${prof.terkonfirmasi === 'YA' ? 'Profil Terkonfirmasi' : 'Lengkapi Profil Usaha'}</div>
                  </div>
                </button>
                <button onclick="logoutUser()" title="Keluar Sesi" class="ons-nav-btn ons-nav-logout-btn">
                  ${svgIcon('logout')}
                  <span class="ons-hide-collapsed">Keluar Sesi</span>
                </button>
              </div>
            </aside>

            <!-- Konten Utama -->
            <div class="flex-1 flex flex-col min-w-0">
              <header class="h-14 border-b px-3 sm:px-4 flex items-center justify-between gap-2 sticky top-0 z-30" style="background:var(--ons-bg-card);border-color:var(--ons-border)">
                <div class="flex items-center gap-2 min-w-0">
                  <button onclick="window.openMobileDrawer()" aria-label="Buka Daftar Menu Apotek" class="md:hidden ons-btn ons-btn-ghost p-0 w-11 h-11 rounded-lg">${svgIcon('menu')}</button>
                  <img src="${ONSStore.esc(logoSrc)}" alt="Logo" class="w-7 h-7 rounded object-cover bg-white md:hidden"/>
                  <span class="badge-bpom ${ONSApi.isDemoMode() ? 'bpom-terbatas' : 'bpom-bebas'}">${ONSApi.isDemoMode() ? 'DEMO SANDBOX' : 'LIVE GAS /EXEC'}</span>
                  <span id="apiLatencyBadge" class="hidden sm:inline-block font-mono-num text-[11px] px-2 py-0.5 rounded bg-slate-500/10" style="color:var(--ons-text-soft)">v16.0 &bull; ${ONSApi.getLastLatency ? ONSApi.getLastLatency() + 'ms' : 'Siap'}</span>
                </div>
                <div class="flex items-center gap-1.5 sm:gap-2">
                  <button onclick="window.openCommandPalette()" aria-label="Cari Menu dan Obat" class="ons-btn ons-btn-ghost text-xs px-2.5" title="Cari Sub-Menu / Obat (Ctrl+K)">${svgIcon('search', 'w-4 h-4')}<span class="hidden sm:inline">Cari</span> <kbd class="hidden md:inline ml-0.5 px-1 py-0.5 text-[10px] rounded border opacity-70">Ctrl+K</kbd></button>
                  <div id="headerAlertHost" class="relative">
                    <button onclick="window.toggleHeaderAlerts()" aria-label="Radar Notifikasi Apotek" class="ons-btn ons-btn-ghost text-xs px-2.5" title="Radar Notifikasi Apotek">${svgIcon('bell', 'w-4 h-4')} ${alertsCount ? `<span class="px-1.5 py-0.2 rounded-full bg-red-600 text-white text-[10px] font-bold">${alertsCount}</span>` : ''}</button>
                  </div>
                  <button id="pwaInstallBtn" onclick="window.triggerPwaInstall()" class="ons-btn ons-btn-primary text-xs hidden">Install</button>
                  <button onclick="ONSStore.toggleDarkMode();renderApp();" aria-label="Ganti Tema Terang atau Malam" class="ons-btn ons-btn-ghost text-xs px-2.5">${st.darkMode ? svgIcon('sun', 'w-4 h-4') : svgIcon('moon', 'w-4 h-4')}<span class="hidden lg:inline">${st.darkMode ? 'Terang' : 'Malam'}</span></button>
                </div>
              </header>

              <!-- Breadcrumb & Sub-Menu Kontekstual Cepat -->
              <div id="workspaceSubnavBar" class="ons-subnav-bar">${renderSubnavBarHtml()}</div>

              <main id="mainViewSlot" class="flex-1 p-4 md:p-6 ons-main-scroll"></main>
            </div>

            <!-- Mobile Bottom Nav (<768px) dengan Touch Target >=44px & Drawer Menu -->
            <nav aria-label="Navigasi Cepat Mobile" class="ons-mobile-only fixed bottom-0 inset-x-0 border-t z-40 grid grid-cols-5 ons-mobile-bottom" style="background:var(--ons-bg-card);border-color:var(--ons-border)">
              ${[
                { id: 'dashboard', l: 'Beranda', i: 'home' },
                { id: 'pos', l: 'Kasir', i: 'pos' },
                { id: 'gudang', l: 'Gudang', i: 'inventory' },
                { id: 'billing', l: 'Tagihan', i: 'receipt' }
              ].map((b) => `<button data-mobile-nav="${b.id}" onclick="navigateView('${b.id}')" class="flex flex-col items-center justify-center min-h-[44px] text-[11px] font-semibold ${st.activeView === b.id ? 'text-blue-600' : ''}">
                ${svgIcon(b.i, 'w-5 h-5')}<span class="mt-0.5">${b.l}</span>
              </button>`).join('')}
              <button onclick="window.openMobileDrawer()" aria-label="Buka Semua Menu" class="flex flex-col items-center justify-center min-h-[44px] text-[11px] font-semibold">
                ${svgIcon('menu', 'w-5 h-5')}<span class="mt-0.5">Menu</span>
              </button>
            </nav>
          </div>
        `;
        window.renderActiveView();
      };

      // Hotkey POS & Global Command Palette (F2 scan, F4 Tunai, F8 QRIS, F9 Hold Antrean, Esc tutup, Ctrl+K Command)
      window.addEventListener('keydown', (e) => {
        if (!ONSApi.getSession()) return;
        if (e.key === 'Escape') {
          ONSStore.closeModal();
          ONSStore.closeDrawer();
          return;
        }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          window.openCommandPalette();
          return;
        }
        if (e.key === 'F2') {
          e.preventDefault();
          window.navigateView('pos');
          setTimeout(() => document.getElementById('posSearchInput')?.focus(), 40);
          return;
        }
        if (ONSStore.AppState.activeView === 'pos' && !document.getElementById('onsModalRoot')) {
          if (e.key === 'F4' && typeof window.posQuickCheckoutShortcut === 'function') {
            e.preventDefault();
            window.posQuickCheckoutShortcut('TUNAI');
            return;
          }
          if (e.key === 'F8' && typeof window.posQuickCheckoutShortcut === 'function') {
            e.preventDefault();
            window.posQuickCheckoutShortcut('QRIS');
            return;
          }
          if (e.key === 'F9' && typeof window.openHoldCartModal === 'function') {
            e.preventDefault();
            window.openHoldCartModal();
          }
        }
      });

      // PWA Install Prompt
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        ONSStore.AppState.deferredInstallPrompt = e;
        document.getElementById('pwaInstallBtn')?.classList.remove('hidden');
      });

      window.triggerPwaInstall = async () => {
        const promptEv = ONSStore.AppState.deferredInstallPrompt;
        if (promptEv) {
          promptEv.prompt();
          await promptEv.userChoice;
          ONSStore.AppState.deferredInstallPrompt = null;
        } else {
          toast('Gunakan menu browser (Add to Home Screen / Install App) untuk memasang PWA.', 'info');
        }
      };

      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }

      window.renderApp();
      if (ONSApi.getSession()) window.bootLoadState(false);
    })();
  </script>
</body>
</html>
