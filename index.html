      function getMenuBadges() {
        const st = ONSStore.AppState;
        const nearEd = (st.stokBatch || []).filter((b) => b.status_batch === 'AKTIF' && b.qty_sisa > 0 && ONSStore.daysUntil(b.tgl_kadaluarsa) <= 90).length;
        const lowStock = ONSStore.canSeeFinancialCost()
          ? (st.masterObat || []).filter((o) => ONSStore.getTotalStok(o.id_obat) <= Number(o.stok_min || 10)).length
          : 0;
        const omniNew = (st.omnichannelOrders || []).filter((o) => o.status_order === 'BARU').length;
        const omniPending = (st.omnichannelOrders || []).filter((o) => o.status_order !== 'SELESAI' && o.status_order !== 'BATAL').length;
        const erxPending = ONSStore.canSeeFinancialCost()
          ? (st.rekamKlinis || []).filter((r) => r.status_klinis === 'ANTRIAN_VALIDASI_APJ').length
          : 0;
        return { nearEd, lowStock, invAlerts: nearEd + lowStock, omniNew, omniPending, erxPending };
      }

      function getAllowedMenuTree() {
        const tree = [];
        const curRole = ONSStore.getRole();
        MENU_TREE.forEach((grp) => {
          if (grp.directView) {
            if (ONSStore.canAccessView(grp.directView)) tree.push(grp);
            return;
          }
          const kids = (grp.children || []).filter((c) => {
            if (!ONSStore.canAccessView(c.viewId)) return false;
            if (c.roles && !c.roles.includes(curRole)) return false;
            return true;
          });
          if (kids.length) tree.push(Object.assign({}, grp, { children: kids }));
        });
        return tree;
      }

      function loadOpenGroups() {
        try {
          const parsed = JSON.parse(localStorage.getItem(OPEN_GROUPS_KEY) || 'null');
          if (Array.isArray(parsed)) return new Set(parsed);
        } catch (e) {}
        return new Set(['grp-pos', 'grp-inv']);
      }
      const openGroupsSet = loadOpenGroups();
      let sidebarCollapsed = localStorage.getItem(SIDEBAR_MINI_KEY) === '1';

      function saveOpenGroups() {
        try { localStorage.setItem(OPEN_GROUPS_KEY, JSON.stringify(Array.from(openGroupsSet))); } catch (e) {}
      }

      function isSubItemActive(item, grp) {
        const st = ONSStore.AppState;
        if (st.activeView !== item.viewId) return false;
        if (!item.subTab) return true;
        const parent = grp || getActiveParentGroup();
        if (parent && parent.children) {
          const sameViewCount = parent.children.filter((c) => c.viewId === item.viewId).length;
          if (sameViewCount <= 1) return true;
        }
        const curSub = (st.subTabs && st.subTabs[item.viewId]) || '';
        return !curSub ? item === parent?.children?.[0] : curSub === item.subTab;
      }

      function getActiveParentGroup() {
        const st = ONSStore.AppState;
        const tree = getAllowedMenuTree();
        for (const grp of tree) {
          if (grp.directView && grp.directView === st.activeView) return grp;
          if ((grp.children || []).some((c) => c.viewId === st.activeView)) return grp;
        }
        return tree[0] || null;
      }

      function getActiveSubItem(grp) {
        if (!grp || grp.directView) return null;
        const st = ONSStore.AppState;
        const curSub = (st.subTabs && st.subTabs[st.activeView]) || '';
        return grp.children.find((c) => c.viewId === st.activeView && (!c.subTab || c.subTab === curSub))
          || grp.children.find((c) => c.viewId === st.activeView)
          || null;
      }

      function renderMenuTreeHtml(isDrawer) {
        const tree = getAllowedMenuTree();
        const badges = getMenuBadges();
        const activeGrp = getActiveParentGroup();
        if (activeGrp && !activeGrp.directView) openGroupsSet.add(activeGrp.id);

        return tree.map((grp) => {
          if (grp.directView) {
            const isAct = ONSStore.AppState.activeView === grp.directView;
            return `<div class="ons-menu-group">
              <button onclick="navigateView('${grp.directView}')" title="${ONSStore.esc(grp.label)}" class="ons-menu-parent ${isAct ? 'has-active' : ''}">
                <span class="flex items-center gap-2.5 min-w-0">${svgIcon(grp.icon)}<span class="truncate ons-hide-collapsed">${ONSStore.esc(grp.label)}</span></span>
              </button>
            </div>`;
          }
          const isExpanded = openGroupsSet.has(grp.id);
          const hasAct = activeGrp && activeGrp.id === grp.id;
          const bVal = grp.badgeKey ? Number(badges[grp.badgeKey] || 0) : 0;
          const firstChild = grp.children[0];

          return `<div class="ons-menu-group">
            <button type="button"
              aria-expanded="${isExpanded ? 'true' : 'false'}"
              title="${ONSStore.esc(grp.label)}"
              onclick="window.onClickParentMenu('${grp.id}','${firstChild ? firstChild.viewId : ''}','${firstChild ? firstChild.subTab : ''}')"
              class="ons-menu-parent ${hasAct ? 'has-active' : ''}">
              <span class="flex items-center gap-2.5 min-w-0">
                ${svgIcon(grp.icon)}
                <span class="truncate ons-hide-collapsed">${ONSStore.esc(grp.label)}</span>
              </span>
              <span class="flex items-center gap-1.5 ons-hide-collapsed shrink-0">
                ${bVal > 0 ? `<span class="ons-nav-badge ${grp.badgeTone || ''}">${bVal}</span>` : ''}
                ${svgIcon('chevron', 'ons-chevron')}
              </span>
            </button>
            <div class="ons-submenu-wrap ${isExpanded ? '' : 'is-closed'}">
              <div class="ons-submenu-list">
                ${grp.children.map((sub) => {
                  const subAct = isSubItemActive(sub, grp);
                  const sbVal = sub.badgeKey ? Number(badges[sub.badgeKey] || 0) : 0;
                  return `<button type="button"
                    data-nav-id="${sub.viewId}"
                    data-sub-tab="${sub.subTab || ''}"
                    onclick="navigateView('${sub.viewId}','${sub.subTab || ''}')"
                    class="ons-submenu-btn ${subAct ? 'active' : ''}">
                    <span class="flex items-center gap-2 min-w-0">
                      <span class="ons-submenu-dot"></span>
                      <span class="truncate">${ONSStore.esc(sub.label)}</span>
                    </span>
                    ${sbVal > 0 ? `<span class="ons-nav-badge ${sub.badgeTone || ''}">${sbVal}</span>` : ''}
                  </button>`;
                }).join('')}
              </div>
            </div>
          </div>`;
        }).join('');
      }

      function renderSubnavBarHtml() {
        const grp = getActiveParentGroup();
        if (!grp) return '';
        const activeSub = getActiveSubItem(grp);
        const badges = getMenuBadges();
        const trail = activeSub
          ? `<span>${ONSStore.esc(grp.label)}</span> <span class="opacity-40 mx-1">/</span> <strong style="color:var(--ons-text-main)">${ONSStore.esc(activeSub.label)}</strong>`
          : `<strong style="color:var(--ons-text-main)">${ONSStore.esc(grp.label)}</strong>`;

        const chipsHtml = (grp.children && grp.children.length > 1) ? `
          <div class="ons-subnav-ribbon mt-2" role="navigation" aria-label="Sub-menu cepat ${ONSStore.esc(grp.label)}">
            ${grp.children.map((sub) => {
              const act = isSubItemActive(sub, grp);
              const b = sub.badgeKey ? Number(badges[sub.badgeKey] || 0) : 0;
              return `<button type="button" onclick="navigateView('${sub.viewId}','${sub.subTab || ''}')" class="ons-subnav-chip ${act ? 'active' : ''}">
                <span>${ONSStore.esc(sub.label)}</span>
                ${b > 0 ? `<span class="font-mono-num text-[10px] px-1.5 py-0.2 rounded-full ${act ? 'bg-white/25 text-white' : 'bg-blue-500/15 text-blue-600'}">${b}</span>` : ''}
              </button>`;
            }).join('')}
          </div>` : '';

        return `<div class="flex flex-wrap items-center justify-between gap-2 text-xs" style="color:var(--ons-text-soft)">
          <div class="flex items-center flex-wrap gap-1">${trail}</div>
          <div class="hidden sm:flex items-center gap-2 text-[11px]">
            <span>Pintasan: <kbd class="px-1 py-0.5 rounded border font-mono-num">F2</kbd> Kasir &bull; <kbd class="px-1 py-0.5 rounded border font-mono-num">Ctrl+K</kbd> Cari Sub-Menu</span>
          </div>
        </div>${chipsHtml}`;
      }

      window.syncNavHighlight = function () {
        const sideMount = document.getElementById('sidebarMenuMount');
        if (sideMount) sideMount.innerHTML = renderMenuTreeHtml(false);
        const drawerMount = document.getElementById('drawerMenuMount');
        if (drawerMount) drawerMount.innerHTML = renderMenuTreeHtml(true);
        const subBar = document.getElementById('workspaceSubnavBar');
        if (subBar) subBar.innerHTML = renderSubnavBarHtml();
        const curView = ONSStore.AppState.activeView;
        document.querySelectorAll('[data-mobile-nav]').forEach((el) => {
          const isMatch = el.getAttribute('data-mobile-nav') === curView;
          el.classList.toggle('text-blue-600', isMatch);
        });
      };

      window.onClickParentMenu = function (grpId, firstViewId, firstSubTab) {
        if (sidebarCollapsed) {
          sidebarCollapsed = false;
          localStorage.setItem(SIDEBAR_MINI_KEY, '0');
          document.getElementById('desktopSidebar')?.classList.remove('collapsed');
          openGroupsSet.add(grpId);
          saveOpenGroups();
          if (firstViewId) navigateView(firstViewId, firstSubTab || '');
          else window.syncNavHighlight();
          return;
        }
        if (openGroupsSet.has(grpId)) openGroupsSet.delete(grpId);
        else openGroupsSet.add(grpId);
        saveOpenGroups();
        window.syncNavHighlight();
      };

      window.toggleSidebarCollapsed = function () {
        sidebarCollapsed = !sidebarCollapsed;
        localStorage.setItem(SIDEBAR_MINI_KEY, sidebarCollapsed ? '1' : '0');
        const side = document.getElementById('desktopSidebar');
        if (side) side.classList.toggle('collapsed', sidebarCollapsed);
      };

      window.openMobileDrawer = function () {
        if (document.getElementById('mobileNavDrawer')) return;
        const st = ONSStore.AppState;
        const dr = document.createElement('div');
        dr.id = 'mobileNavDrawer';
        dr.className = 'ons-drawer-backdrop md:hidden';
        dr.innerHTML = `<div class="ons-drawer-panel" role="dialog" aria-label="Menu Apotek">
          <div class="flex items-center justify-between gap-2 pb-3 mb-2 border-b border-white/10">
            <div class="flex items-center gap-2.5 min-w-0">
              <img src="./icons/ons-farma-app-icon.png" alt="Logo" class="w-9 h-9 rounded-lg"/>
              <div class="min-w-0">
                <div class="font-bold text-sm text-white truncate">ONS FARMA v12.0</div>
                <div class="text-[11px] text-sky-300 truncate">${ONSStore.esc(st.cabangId)} &bull; ${ONSStore.esc(ONSStore.getRole())}</div>
              </div>
            </div>
            <button onclick="window.closeMobileDrawer()" aria-label="Tutup Menu" class="p-2 rounded-lg text-slate-300 hover:bg-white/10 min-w-[44px] min-h-[44px] flex items-center justify-center">${svgIcon('close')}</button>
          </div>
          <div id="drawerMenuMount" class="flex-1 space-y-1">${renderMenuTreeHtml(true)}</div>
          <div class="pt-3 mt-3 border-t border-white/10 space-y-2 text-xs">
            <div class="px-2 text-slate-300 truncate"><b>${ONSStore.esc((st.user && st.user.nama_lengkap) || '')}</b></div>
            <button onclick="window.closeMobileDrawer();logoutUser();" class="ons-nav-btn text-red-300 hover:bg-red-500/20">${svgIcon('logout')}<span>Keluar Sesi</span></button>
          </div>
        </div>`;
        dr.addEventListener('click', (e) => { if (e.target === dr) window.closeMobileDrawer(); });
        document.body.appendChild(dr);
      };

      window.closeMobileDrawer = function () {
        const el = document.getElementById('mobileNavDrawer');
        if (el) el.remove();
      };

      window.navigateView = function (viewId, subTab) {
        if (!ONSStore.canAccessView(viewId)) {
          toast('Akses dibatasi untuk peran ' + ONSStore.getRole(), 'warn');
          return;
        }
        const st = ONSStore.AppState;
        st.activeView = viewId;
        if (subTab !== undefined && subTab !== '') {
          if (!st.subTabs) st.subTabs = {};
          st.subTabs[viewId] = subTab;
          st.activeSubTab = subTab;
          const setterMap = {
            pos: window.setPosSubTab,
            gudang: window.setGudangTab,
            defecta: window.setDefectaTab,
            faktur: window.setFakturTab,
            klinis: window.setKlinisTab,
            'eresep-prb': window.setEresepTab,
            finance: window.setFinanceTab,
            sipnap: window.setSipnapTab,
            billing: window.setBillingTab,
            'doc-engine': window.setDocTab,
            settings: window.setSettingsTab
          };
          if (typeof setterMap[viewId] === 'function') {
            setterMap[viewId](subTab);
            window.closeMobileDrawer();
            return;
          }
          if (viewId === 'crm-wa' && window.ONSViewsOmniCrm && typeof window.ONSViewsOmniCrm.setCrmTab === 'function') {
            window.ONSViewsOmniCrm.setCrmTab(subTab);
            window.closeMobileDrawer();
            return;
          }
          if (viewId === 'omnichannel' && window.ONSViewsOmniCrm && typeof window.ONSViewsOmniCrm.setOmniFilter === 'function') {
            window.ONSViewsOmniCrm.setOmniFilter(subTab);
            window.closeMobileDrawer();
            return;
          }
        }
        window.closeMobileDrawer();
        window.renderActiveView();
        window.syncNavHighlight();
      };

      window.bootLoadState = async function (forceRefresh) {
        const st = ONSStore.AppState;
        const ses = ONSApi.getSession();
        if (!ses || !ses.token) return;
        st.user = ses.user;
        st.cabangId = ses.cabang_id || (ses.user && ses.user.cabang_id) || 'ONS-01';

        // SWR Instant Cache Render
        const cached = ONSApi.getCachedRead('boot.getState', { cabang_id: st.cabangId });
        if (cached && !forceRefresh) {
          applyBootPayload(cached);
          window.renderApp();
        }

        try {
          const live = await ONSApi.callApi('boot.getState', { cabang_id: st.cabangId });
          applyBootPayload(live);
          st.booted = true;
          window.renderApp();
        } catch (err) {
          if (!cached) toast('Gagal memuat state: ' + err.message, 'err');
        }
      };

      window.applyBootPayload = function (data) {
        const st = ONSStore.AppState;
        st.masterObat = data.master_obat || [];
        st.stokBatch = data.stok_batch || [];
        st.members = data.members || [];
        st.supplierPbf = data.supplier_pbf || [];
        st.coldChain = data.cold_chain || [];
        st.rekamKlinis = data.rekam_klinis || [];
        st.penjualan = data.penjualan || [];
        st.detailPenjualan = data.detail_penjualan || [];
        st.mutasiStok = data.mutasi_stok || [];
        st.omnichannelOrders = data.omnichannel_orders || [];
        st.strukTemplates = data.struk_templates || [];
        st.fakturPbf = data.faktur_pbf || [];
        st.jurnalKeuangan = data.jurnal_keuangan || [];
      };
      const applyBootPayload = window.applyBootPayload;

      window.logoutUser = function () {
        ONSApi.setSession(null);
        ONSStore.AppState.user = null;
        ONSStore.AppState.booted = false;
        window.renderApp();
      };

      window.renderActiveView = function () {
        const slot = document.getElementById('mainViewSlot');
        if (!slot) return;
        const v = ONSStore.AppState.activeView;
        const v1 = window.ONSViewsAuthDashPos;
        const v2 = window.ONSViewsInventoryProcurement;
        const v3 = window.ONSViewsClinicalFinanceAdmin;
        const v4 = window.ONSViewsOmniCrm;

        switch (v) {
          case 'dashboard': slot.innerHTML = v1.renderDashboardView(); break;
          case 'pos': slot.innerHTML = v1.renderPosView(); break;
          case 'omnichannel': slot.innerHTML = v4.renderOmnichannelView(); break;
          case 'obat': slot.innerHTML = v2.renderMasterObatView(); break;
          case 'gudang': slot.innerHTML = v2.renderGudangView(); break;
          case 'defecta': slot.innerHTML = v2.renderDefectaView(); break;
          case 'faktur': slot.innerHTML = v2.renderFakturView(); break;
          case 'klinis': slot.innerHTML = v3.renderKlinisView(); break;
          case 'eresep-prb': slot.innerHTML = v3.renderEresepPrbView(); break;
          case 'crm-wa': slot.innerHTML = v4.renderCrmWaView(); break;
          case 'finance': slot.innerHTML = v3.renderFinanceView(); break;
          case 'billing': slot.innerHTML = v3.renderBillingModuleView(); break;
          case 'doc-engine': slot.innerHTML = v3.renderDocEngineView(); break;
          case 'tutup-shift': slot.innerHTML = v3.renderTutupShiftView(); break;
          case 'sipnap': slot.innerHTML = v3.renderSipnapParetoView(); break;
          case 'settings': slot.innerHTML = v3.renderSettingsView(); break;
          case 'mobile-preview': slot.innerHTML = v3.renderMobilePreviewView(); break;
          default: slot.innerHTML = v1.renderDashboardView();
        }
      };

      function buildOperationalAlerts() {
        const st = ONSStore.AppState;
        const alerts = [];
        const nearEdCount = (st.stokBatch || []).filter((b) => b.status_batch === 'AKTIF' && b.qty_sisa > 0 && ONSStore.daysUntil(b.tgl_kadaluarsa) <= 90).length;
        if (nearEdCount > 0) alerts.push({ view: 'gudang', sub: 'batch', tone: 'text-red-600', title: `${nearEdCount} Batch Kritis Near-ED (<=90 hari)`, desc: 'Prioritaskan FEFO atau Retur BAR-PBF.' });
        const lowCount = (st.masterObat || []).filter((o) => ONSStore.getTotalStok(o.id_obat) <= Number(o.stok_min || 10)).length;
        if (lowCount > 0 && ONSStore.canSeeFinancialCost()) alerts.push({ view: 'defecta', sub: 'order', tone: 'text-amber-600', title: `${lowCount} Obat di Bawah Stok Minimum`, desc: 'Buat SP BPOM otomatis dari menu Defecta.' });
        const newOmni = (st.omnichannelOrders || []).filter((o) => o.status_order === 'BARU').length;
        if (newOmni > 0) alerts.push({ view: 'omnichannel', sub: 'SEMUA', tone: 'text-sky-600', title: `${newOmni} Order Online/WA Baru Masuk`, desc: 'Siap diverifikasi & dimuat ke Kasir POS.' });
        const erxPend = (st.rekamKlinis || []).filter((r) => r.status_klinis === 'ANTRIAN_VALIDASI_APJ').length;
        if (erxPend > 0 && ONSStore.canSeeFinancialCost()) alerts.push({ view: 'eresep-prb', sub: 'erx', tone: 'text-purple-600', title: `${erxPend} E-Resep Menunggu PIN APJ`, desc: 'Periksa interaksi obat & verifikasi SIPA.' });
        return alerts;
      }

      window.toggleHeaderAlerts = function () {
        const existing = document.getElementById('headerAlertPopover');
        if (existing) { existing.remove(); return; }
        const alerts = buildOperationalAlerts();
        const host = document.getElementById('headerAlertHost');
        if (!host) return;
        const pop = document.createElement('div');
        pop.id = 'headerAlertPopover';
        pop.className = 'ons-popover-panel p-3.5 space-y-2';
        pop.innerHTML = `
          <div class="flex items-center justify-between border-b pb-2" style="border-color:var(--ons-border)">
            <span class="font-bold text-xs">Radar Peringatan Apotek (${alerts.length})</span>
            <button onclick="document.getElementById('headerAlertPopover')?.remove()" class="text-xs font-bold opacity-60">&times;</button>
          </div>
          ${alerts.length === 0 ? '<div class="text-xs py-3 text-center opacity-70">Semua indikator gudang, klinis & order aman!</div>' : alerts.map((a) => `
            <button onclick="document.getElementById('headerAlertPopover')?.remove();navigateView('${a.view}','${a.sub || ''}');" class="w-full text-left p-2 rounded-lg border hover:bg-slate-500/10 block space-y-0.5" style="border-color:var(--ons-border)">
              <div class="text-xs font-bold ${a.tone}">${ONSStore.esc(a.title)}</div>
              <div class="text-[11px]" style="color:var(--ons-text-soft)">${ONSStore.esc(a.desc)}</div>
            </button>`).join('')}
        `;
        host.appendChild(pop);
      };

      window.openCommandPalette = function () {
        const st = ONSStore.AppState;
        const flatNav = [];
        getAllowedMenuTree().forEach((grp) => {
          if (grp.directView) {
            flatNav.push({ viewId: grp.directView, subTab: '', grp: 'Utama', label: grp.label, icon: grp.icon, kw: grp.kw || '' });
          } else {
            (grp.children || []).forEach((c) => {
              flatNav.push({ viewId: c.viewId, subTab: c.subTab || '', grp: grp.label, label: c.label, icon: grp.icon, kw: c.kw || '' });
            });
          }
        });
        ONSStore.openModal(`<div class="p-4 space-y-3">
          <div class="flex items-center gap-2 border-b pb-2" style="border-color:var(--ons-border)">
            <span class="text-sm font-bold text-blue-600">Ctrl+K</span>
            <input id="cmdkSearchInp" class="ons-input flex-1 text-sm" placeholder="Cari menu / sub-menu (mis. kartu stok, struk, retur, blast), obat KFA, atau order..." oninput="window.filterCmdk(this.value)"/>
            <button onclick="ONSStore.closeModal()" class="ons-btn ons-btn-ghost text-xs py-1 px-2">Esc</button>
          </div>
          <div id="cmdkResultsBox" class="max-h-80 overflow-y-auto space-y-1 text-xs"></div>
        </div>`, '620px');
        window.filterCmdk = function (rawQ) {
          const q = String(rawQ || '').trim().toLowerCase();
          const box = document.getElementById('cmdkResultsBox');
          if (!box) return;
          const navMatches = flatNav.filter((n) => !q || `${n.label} ${n.grp} ${n.kw}`.toLowerCase().includes(q)).slice(0, 9);
          const obatMatches = q ? (st.masterObat || []).filter((o) => `${o.nama_dagang} ${o.zat_aktif} ${o.kode_kfa}`.toLowerCase().includes(q)).slice(0, 5) : [];
          const orderMatches = q ? (st.omnichannelOrders || []).filter((o) => `${o.no_order} ${o.nama_pelanggan}`.toLowerCase().includes(q)).slice(0, 4) : [];

          let html = navMatches.map((n) => `
            <div onclick="ONSStore.closeModal();navigateView('${n.viewId}','${n.subTab}');" class="ons-cmdk-row">
              <div class="flex items-center gap-2">${svgIcon(n.icon, 'opacity-70')}<strong>${ONSStore.esc(n.label)}</strong></div>
              <span class="text-[11px]" style="color:var(--ons-text-soft)">${ONSStore.esc(n.grp)}</span>
            </div>`).join('');
          if (obatMatches.length) {
            html += `<div class="ons-sidebar-group-label">Stok Obat &amp; Tambah ke Kasir</div>` + obatMatches.map((o) => `
              <div onclick="ONSStore.closeModal();navigateView('pos','kasir');setTimeout(()=>window.addPosItemById && window.addPosItemById('${ONSStore.esc(o.id_obat)}'),30);" class="ons-cmdk-row">
                <div><strong>${ONSStore.esc(o.nama_dagang)}</strong> <span style="color:var(--ons-text-soft)">(${ONSStore.getTotalStok(o.id_obat)} ${ONSStore.esc(o.satuan_dasar)})</span></div>
                <span class="font-mono-num font-bold text-emerald-600">${ONSStore.rp(o.harga_umum)}</span>
              </div>`).join('');
          }
          if (orderMatches.length) {
            html += `<div class="ons-sidebar-group-label">Pesanan Omnichannel</div>` + orderMatches.map((o) => `
              <div onclick="ONSStore.closeModal();navigateView('omnichannel','SEMUA');" class="ons-cmdk-row">
                <div><strong>${ONSStore.esc(o.no_order)}</strong> &bull; ${ONSStore.esc(o.nama_pelanggan)}</div>
                <span class="badge-bpom bpom-terbatas">${ONSStore.esc(o.status_order)}</span>
              </div>`).join('');
          }
          box.innerHTML = html || '<div class="p-6 text-center opacity-60">Tidak ada hasil yang cocok.</div>';
        };
        window.filterCmdk('');
        setTimeout(() => document.getElementById('cmdkSearchInp')?.focus(), 20);
      };

      window.renderApp = function () {
        const root = document.getElementById('appRoot');
        if (window.ONSViewsAuthDashPos.renderPublicStandaloneIfApplicable(root)) return;

        const ses = ONSApi.getSession();
        if (!ses || !ses.token) {
          window.ONSViewsAuthDashPos.renderLoginView(root);
          return;
        }

        const st = ONSStore.AppState;
        st.user = ses.user;
        const alertsCount = buildOperationalAlerts().length;

        root.innerHTML = `
          <div class="min-h-screen flex flex-col md:flex-row">
            <!-- Sidebar Desktop Menu + Sub-Menu Akordeon v12.0 -->
            <aside id="desktopSidebar" class="ons-sidebar ${sidebarCollapsed ? 'collapsed' : ''} shrink-0 p-3 flex flex-col justify-between ons-desktop-only sticky top-0 h-screen overflow-y-auto">
              <div>
                <div class="flex items-center justify-between gap-2 px-1.5 py-2 mb-2.5 border-b border-white/10">
                  <div class="flex items-center gap-2.5 min-w-0">
                    <img src="./icons/ons-farma-app-icon.png" alt="Logo" class="w-9 h-9 rounded-lg shrink-0"/>
                    <div class="min-w-0 ons-hide-collapsed">
                      <div class="font-bold text-sm text-white truncate">ONS FARMA v12.0</div>
                      <div class="text-[11px] text-sky-300 truncate">${ONSStore.esc(st.cabangId)} &bull; ${ONSStore.esc(ONSStore.getRole())}</div>
                    </div>
                  </div>
                  <button onclick="window.toggleSidebarCollapsed()" aria-label="Perkecil atau Perlebar Sidebar" title="Perkecil / Perlebar Menu" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-white/10 shrink-0">
                    ${svgIcon('collapse')}
                  </button>
                </div>
                <nav id="sidebarMenuMount" aria-label="Menu Utama Apotek" class="space-y-1">
                  ${renderMenuTreeHtml(false)}
                </nav>
              </div>
              <div class="pt-3 mt-3 border-t border-white/10 space-y-2 text-xs">
                <div class="px-2 text-slate-300 truncate ons-hide-collapsed"><b>${ONSStore.esc(st.user.nama_lengkap)}</b></div>
                <button onclick="logoutUser()" title="Keluar Sesi" class="ons-nav-btn text-red-300 hover:bg-red-500/20">
                  ${svgIcon('logout')}
                  <span class="ons-hide-collapsed">Keluar Sesi</span>
                </button>
              </div>
            </aside>

            <!-- Konten Utama -->
            <div class="flex-1 flex flex-col min-w-0">
              <header class="h-14 border-b px-3 sm:px-4 flex items-center justify-between gap-2 sticky top-0 z-30" style="background:var(--ons-bg-card);border-color:var(--ons-border)">
                <div class="flex items-center gap-2 min-w-0">
                  <button onclick="window.openMobileDrawer()" aria-label="Buka Daftar Menu & Sub-Menu" class="md:hidden ons-btn ons-btn-ghost p-0 w-11 h-11 rounded-lg">${svgIcon('menu')}</button>
                  <img src="./icons/ons-farma-app-icon.png" class="w-7 h-7 rounded md:hidden"/>
                  <span class="badge-bpom ${ONSApi.isDemoMode() ? 'bpom-terbatas' : 'bpom-bebas'}">${ONSApi.isDemoMode() ? 'DEMO SANDBOX' : 'LIVE GAS /EXEC'}</span>
                  <span id="apiLatencyBadge" class="hidden sm:inline-block font-mono-num text-[11px] px-2 py-0.5 rounded bg-slate-500/10" style="color:var(--ons-text-soft)">v12.0 &bull; ${ONSApi.getLastLatency ? ONSApi.getLastLatency() + 'ms' : 'Siap'}</span>
                </div>
                <div class="flex items-center gap-1.5 sm:gap-2">
                  <button onclick="window.openCommandPalette()" aria-label="Cari Menu dan Obat" class="ons-btn ons-btn-ghost text-xs px-2.5" title="Cari Sub-Menu / Obat (Ctrl+K)">${svgIcon('search', 'w-4 h-4')}<span class="hidden sm:inline">Cari</span> <kbd class="hidden md:inline ml-0.5 px-1 py-0.5 text-[10px] rounded border opacity-70">Ctrl+K</kbd></button>
                  <div id="headerAlertHost" class="relative">
                    <button onclick="window.toggleHeaderAlerts()" aria-label="Radar Notifikasi Apotek" class="ons-btn ons-btn-ghost text-xs px-2.5" title="Radar Notifikasi Apotek">${svgIcon('bell', 'w-4 h-4')} ${alertsCount ? `<span class="px-1.5 py-0.2 rounded-full bg-red-600 text-white text-[10px] font-bold">${alertsCount}</span>` : ''}</button>
                  </div>
                  <button id="pwaInstallBtn" onclick="window.triggerPwaInstall()" class="ons-btn ons-btn-primary text-xs hidden">Install</button>
                  <button onclick="ONSStore.toggleDarkMode();renderApp();" aria-label="Ganti Tema Terang atau Malam" class="ons-btn ons-btn-ghost text-xs px-2.5">${st.darkMode ? svgIcon('sun', 'w-4 h-4') : svgIcon('moon', 'w-4 h-4')}<span class="hidden lg:inline">${st.darkMode ? 'Terang' : 'Malam'}</span></button>
                </div>
              </header>

              <!-- Breadcrumb & Sub-Menu Kontekstual Cepat -->
              <div id="workspaceSubnavBar" class="ons-subnav-bar">${renderSubnavBarHtml()}</div>

              <main id="mainViewSlot" class="flex-1 p-4 md:p-6 ons-main-scroll"></main>
            </div>

            <!-- Mobile Bottom Nav (<768px) dengan Touch Target >=44px & Drawer Menu -->
            <nav aria-label="Navigasi Cepat Mobile" class="ons-mobile-only fixed bottom-0 inset-x-0 border-t z-40 grid grid-cols-5 ons-mobile-bottom" style="background:var(--ons-bg-card);border-color:var(--ons-border)">
              ${[
                { id: 'dashboard', l: 'Beranda', i: 'home' },
                { id: 'pos', l: 'Kasir', i: 'pos' },
                { id: 'omnichannel', l: 'Order', i: 'truck' },
                { id: 'gudang', l: 'Gudang', i: 'inventory' }
              ].map((b) => `<button data-mobile-nav="${b.id}" onclick="navigateView('${b.id}')" class="flex flex-col items-center justify-center min-h-[44px] text-[11px] font-semibold ${st.activeView === b.id ? 'text-blue-600' : ''}">
                ${svgIcon(b.i, 'w-5 h-5')}<span class="mt-0.5">${b.l}</span>
              </button>`).join('')}
              <button onclick="window.openMobileDrawer()" aria-label="Buka Semua Menu" class="flex flex-col items-center justify-center min-h-[44px] text-[11px] font-semibold">
                ${svgIcon('menu', 'w-5 h-5')}<span class="mt-0.5">Menu</span>
              </button>
            </nav>
          </div>
        `;
        window.renderActiveView();
      };

      // Hotkey POS & Global Command Palette (F2 fokus barcode, Ctrl+K Command Palette)
      window.addEventListener('keydown', (e) => {
        if (!ONSApi.getSession()) return;
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          window.openCommandPalette();
          return;
        }
        if (e.key === 'F2') {
          e.preventDefault();
          window.navigateView('pos');
          setTimeout(() => document.getElementById('posSearchInput')?.focus(), 40);
        }
      });

      // PWA Install Prompt
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        ONSStore.AppState.deferredInstallPrompt = e;
        document.getElementById('pwaInstallBtn')?.classList.remove('hidden');
      });

      window.triggerPwaInstall = async () => {
        const promptEv = ONSStore.AppState.deferredInstallPrompt;
        if (promptEv) {
          promptEv.prompt();
          await promptEv.userChoice;
          ONSStore.AppState.deferredInstallPrompt = null;
        } else {
          toast('Gunakan menu browser (Add to Home Screen / Install App) untuk memasang PWA.', 'info');
        }
      };

      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }

      window.renderApp();
      if (ONSApi.getSession()) window.bootLoadState(false);
    })();
  </script>
</body>
</html>
